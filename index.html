<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>分身反復横とび</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#e8d6a8;
  font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;color:#2b2b3a;
  user-select:none;-webkit-user-select:none;touch-action:none;
  word-break:auto-phrase;line-break:strict;text-wrap:balance}
body{display:flex;align-items:center;justify-content:center}
.nb{display:inline-block;white-space:nowrap}

/* 絵は画面いっぱい（縦長の端末も横長の画面も、体育館が左右・上下に広がる）。遊ぶ場所は縦9:16で中央 */
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
/* 遊ぶ場所の枠。単位は --q（縦画面＝枠の幅の1%＝1cqw、横画面＝16:9 の枠の幅の 1/220）。文字の置き場所に使うだけで、触れるのは下の絵 */
#stage{position:relative;container-type:size;--q:1cqw;
  width:min(100vw,calc(100dvh*9/16));aspect-ratio:9/16;pointer-events:none}

/* タイトル：ロゴ（分身＋反復横とび）・キャッチ・スタートの案内ひとつ。絵は体育館に並ぶ分身の列（canvas） */
#title{position:absolute;inset:0;z-index:20;text-align:center}
#title.hide{display:none}
#title .head{position:absolute;left:calc(4 * var(--q));right:calc(4 * var(--q));top:calc(11 * var(--q));display:flex;flex-direction:column;align-items:center;gap:calc(2.2 * var(--q))}
#title .tag{font-size:calc(4.4 * var(--q));font-weight:bold;color:#fff;background:#d2382f;border-radius:calc(5 * var(--q));padding:calc(.7 * var(--q)) calc(4.6 * var(--q));letter-spacing:calc(.9 * var(--q));box-shadow:0 calc(.8 * var(--q)) 0 #8f221c}
#title .logo{display:flex;flex-direction:column;align-items:center;line-height:1;font-weight:900;color:#fff;
  -webkit-text-stroke:calc(1.5 * var(--q)) #213a86;paint-order:stroke fill;text-shadow:0 calc(1.5 * var(--q)) 0 #213a86,0 calc(2.6 * var(--q)) calc(3.4 * var(--q)) #0006}
#title .logo span{display:block;white-space:nowrap}
#title .logo .l1{font-size:calc(25 * var(--q));color:#ffd23c;letter-spacing:calc(1 * var(--q))}
#title .logo .l2{font-size:calc(15.5 * var(--q));margin-top:calc(1 * var(--q));-webkit-text-stroke-width:calc(1.05 * var(--q))}   /* 細い字は、縁を細くして白い中身を残す */
#title .catch{font-size:calc(5.2 * var(--q));font-weight:bold;color:#213a86;background:#fffe;border-radius:calc(3 * var(--q));padding:calc(1 * var(--q)) calc(4 * var(--q));margin-top:calc(1.4 * var(--q))}
#title .t4{position:absolute;left:0;right:0;top:calc(150 * var(--q));margin:0 auto;width:max-content;font-size:calc(6 * var(--q));font-weight:bold;color:#fff;background:#e0356f;border-radius:calc(6 * var(--q));
  padding:calc(2 * var(--q)) calc(8 * var(--q));box-shadow:0 calc(1.2 * var(--q)) 0 #a82350;animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{transform:scale(1.07)}}

/* 大会の一覧・測定前（ライバルの紹介）・エンディング */
.scr{position:absolute;inset:0;z-index:25;display:none;flex-direction:column;pointer-events:auto;
  background:#f1e6c2;box-shadow:0 0 0 100vmax #f1e6c2;padding:calc(5 * var(--q)) calc(5 * var(--q)) calc(4.5 * var(--q));gap:calc(2 * var(--q))}
.scr.on{display:flex;animation:fade .22s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
#list .hd,#shop .hd{display:flex;justify-content:space-between;align-items:baseline;font-size:calc(6.2 * var(--q));font-weight:900;color:#2c4aa0;
  border-bottom:calc(.6 * var(--q)) solid #2c4aa0;padding-bottom:calc(1.4 * var(--q));letter-spacing:calc(.5 * var(--q));white-space:nowrap}
#list .hd small,#shop .hd small{font-size:calc(3.8 * var(--q));color:#55608a;letter-spacing:0;font-weight:bold}
#listBody,#shopBody{flex:1;min-height:0;display:flex;flex-direction:column;gap:calc(1.7 * var(--q));overflow-y:auto;touch-action:pan-y;padding:calc(1 * var(--q)) calc(1.4 * var(--q)) calc(1.4 * var(--q))}
.bar{display:flex;justify-content:space-between;align-items:center;gap:calc(3 * var(--q))}
.bar .tk{font-size:calc(4.2 * var(--q));font-weight:bold;color:#55608a;white-space:nowrap}
.bar .tk b{font-size:calc(5.6 * var(--q));color:#d2382f;font-variant-numeric:tabular-nums;margin-left:calc(1 * var(--q))}
.sm{height:calc(9 * var(--q));padding:0 calc(5.5 * var(--q));font-size:calc(4.2 * var(--q));white-space:nowrap;pointer-events:auto;border-radius:calc(3 * var(--q))}
.hot{animation:blink 1.1s ease-in-out infinite}
.tn{flex:1 1 0;min-height:calc(11.6 * var(--q));max-height:calc(17 * var(--q));display:grid;grid-template-columns:calc(8.4 * var(--q)) minmax(0,1fr) auto;align-items:center;column-gap:calc(2.6 * var(--q));
  border:calc(.5 * var(--q)) solid #2c4aa0;border-radius:calc(2 * var(--q));background:#fffdf2;padding:0 calc(2.8 * var(--q)) 0 calc(2.4 * var(--q));font:inherit;color:#2b2b3a;text-align:left;
  cursor:pointer;box-shadow:0 calc(.8 * var(--q)) 0 #1c3170;touch-action:manipulation}
.tn:active:not(:disabled){transform:translateY(calc(.6 * var(--q)));box-shadow:0 calc(.2 * var(--q)) 0 #1c3170}
.tn .no{width:calc(8.4 * var(--q));height:calc(8.4 * var(--q));border-radius:50%;background:#2c4aa0;color:#fff;font-weight:900;font-size:calc(4.6 * var(--q));display:flex;align-items:center;justify-content:center}
.tn .mid{display:flex;flex-direction:column;gap:calc(.5 * var(--q));min-width:0}
.tn .nm{font-size:calc(4.7 * var(--q));font-weight:bold;white-space:nowrap}
.tn .sb{font-size:calc(3.3 * var(--q));color:#55608a;white-space:nowrap}
.tn .rt{display:flex;flex-direction:column;align-items:flex-end;gap:calc(.7 * var(--q))}
.tn .tag{font-size:calc(3.3 * var(--q));font-weight:900;border:calc(.45 * var(--q)) solid;border-radius:calc(1.4 * var(--q));padding:0 calc(1.6 * var(--q));white-space:nowrap;line-height:1.5}
.tn .bs{font-size:calc(3.2 * var(--q));color:#55608a;white-space:nowrap}
.tn.won .tag{color:#d2382f;border-color:#d2382f;transform:rotate(-5deg)}
.tn.next{border-color:#e0356f;box-shadow:0 calc(.8 * var(--q)) 0 #a82350;animation:nextp 1.2s ease-in-out infinite}
.tn.next .tag{background:#e0356f;border-color:#e0356f;color:#fff}
.tn.next .no{background:#e0356f}
@keyframes nextp{50%{transform:scale(1.025)}}
.tn.locked{background:#e6dfc6;border-color:#a6a18a;color:#8b8672;box-shadow:none;cursor:default}
.tn.locked .no{background:#a6a18a}
.tn.locked .sb,.tn.locked .bs{color:#9b9680}
.tn.locked .tag{color:#9b9680;border-color:#b3ae98}
#list .back,#intro .back,#shop .back{align-self:center;height:calc(9 * var(--q));padding:0 calc(7 * var(--q));font-size:calc(3.8 * var(--q));background:transparent;color:#2c4aa0;
  border:calc(.5 * var(--q)) solid #2c4aa0;border-radius:calc(3 * var(--q));box-shadow:0 calc(.6 * var(--q)) 0 #2c4aa066;white-space:nowrap;pointer-events:auto}

#intro .back{background:#fffdf2e8}

/* 購買部 */
.it{flex:1 1 0;min-height:calc(15 * var(--q));max-height:calc(21 * var(--q));display:grid;grid-template-columns:minmax(0,1fr) calc(22 * var(--q));align-items:center;column-gap:calc(2.4 * var(--q));
  border:calc(.5 * var(--q)) solid #2c4aa0;border-radius:calc(2 * var(--q));background:#fffdf2;padding:0 calc(2.4 * var(--q)) 0 calc(3 * var(--q));box-shadow:0 calc(.8 * var(--q)) 0 #1c3170}
.it .mid{display:flex;flex-direction:column;gap:calc(.5 * var(--q));min-width:0}
.it .l1{display:flex;align-items:baseline;gap:calc(2 * var(--q));white-space:nowrap}
.it .nm{font-size:calc(4.5 * var(--q));font-weight:bold}
.it .pips{font-size:calc(3 * var(--q));letter-spacing:calc(.2 * var(--q));color:#e0356f}
.it .pips i{font-style:normal;color:#c9cde0}
.it .pips i.on{color:#e0356f}
.it .ds{font-size:calc(3.4 * var(--q));color:#2b2b3a;white-space:nowrap}
.it .fx{font-size:calc(3.3 * var(--q));color:#2c4aa0;font-weight:bold;white-space:nowrap}
.it .buy{height:calc(11.5 * var(--q));border:0;border-radius:calc(3 * var(--q));font:inherit;font-size:calc(4.8 * var(--q));font-weight:900;color:#fff;cursor:pointer;touch-action:manipulation;
  background:linear-gradient(#ff6b9a,#e0356f);box-shadow:0 calc(1 * var(--q)) 0 #a82350;white-space:nowrap;font-variant-numeric:tabular-nums;pointer-events:auto}
.it .buy:active{transform:translateY(calc(.7 * var(--q)));box-shadow:0 calc(.3 * var(--q)) 0 #a82350}
.it.poor .buy{background:#e6dfc6;color:#8b8672;box-shadow:0 calc(1 * var(--q)) 0 #bdb69c}
.it.locked{background:#e6dfc6;border-color:#a6a18a;box-shadow:none}
.it.locked .buy{background:#cfc9b0;color:#8b8672;box-shadow:none;font-size:calc(3.8 * var(--q))}
.it.locked .fx{color:#8b8672}
.it.max{background:#eef3ff}
.it.max .buy{background:#2c4aa0;color:#fff;box-shadow:none;font-size:calc(4 * var(--q));cursor:default}
.it.got{animation:got .35s ease-out}
.it.no{animation:shake .25s}
@keyframes got{0%{transform:scale(1.04);background:#fff6b0}100%{transform:none}}
@keyframes shake{25%{transform:translateX(calc(-1.2 * var(--q)))}75%{transform:translateX(calc(1.2 * var(--q)))}}
#shop .row{margin-top:0}
#shop .hd small b{color:#d2382f;margin-left:calc(1 * var(--q));font-size:calc(5.4 * var(--q));font-variant-numeric:tabular-nums}
#shopBack{flex:1;height:calc(10 * var(--q));font-size:calc(3.9 * var(--q));background:transparent;color:#2c4aa0;white-space:nowrap;border:calc(.5 * var(--q)) solid #2c4aa0;border-radius:calc(3 * var(--q));box-shadow:0 calc(.6 * var(--q)) 0 #2c4aa066}
#shopGo{flex:1.2;height:calc(12 * var(--q));font-size:calc(5.2 * var(--q));white-space:nowrap}
#intro{position:absolute;left:calc(6 * var(--q));right:calc(6 * var(--q));top:calc(51 * var(--q));z-index:25;display:none;flex-direction:column;align-items:center;gap:calc(3 * var(--q));text-align:center}
#intro.on{display:flex;animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
#inName{font-size:calc(5 * var(--q));font-weight:bold;color:#fff;background:#d2382f;border-radius:calc(5 * var(--q));padding:calc(.8 * var(--q)) calc(5 * var(--q));letter-spacing:calc(.5 * var(--q));box-shadow:0 calc(.8 * var(--q)) 0 #8f221c;white-space:nowrap}
#inCard{width:100%;background:#fffdf2;border:calc(.7 * var(--q)) solid #2c4aa0;border-radius:calc(1.6 * var(--q));box-shadow:0 calc(2 * var(--q)) 0 #1c3170,0 calc(3 * var(--q)) calc(6 * var(--q)) #0006;
  padding:calc(4 * var(--q)) calc(4 * var(--q)) calc(4.4 * var(--q));display:flex;flex-direction:column;align-items:center;gap:calc(1.4 * var(--q))}
#inCard .lb{font-size:calc(3.6 * var(--q));color:#55608a;font-weight:bold;letter-spacing:calc(.4 * var(--q))}
#inRival{font-size:calc(8 * var(--q));font-weight:900;color:#2b2b3a;line-height:1.15}
#inSay{font-size:calc(4.2 * var(--q));color:#2b2b3a;line-height:1.5;margin-bottom:calc(1 * var(--q))}
#inCard .rule{width:100%;border-top:calc(.3 * var(--q)) dashed #9aa7d0;margin:calc(.6 * var(--q)) 0 calc(.2 * var(--q))}
#inRec{font-size:calc(15 * var(--q));font-weight:900;line-height:1;color:#d2382f;font-variant-numeric:tabular-nums;white-space:nowrap}
#inRec small{font-size:calc(5 * var(--q));color:#55608a;font-weight:bold;margin-left:calc(.8 * var(--q))}
#inBest{font-size:calc(3.6 * var(--q));color:#55608a;min-height:calc(4.6 * var(--q))}
#intro .go{font-size:calc(6 * var(--q));font-weight:bold;color:#fff;background:#e0356f;border-radius:calc(6 * var(--q));padding:calc(2 * var(--q)) calc(8 * var(--q));box-shadow:0 calc(1.2 * var(--q)) 0 #a82350;
  white-space:nowrap;animation:blink 1.1s ease-in-out infinite}

/* エンディング：最初の 3 場面は canvas に描く（この画面は透明でタップを受けるだけ）。そのあと宇宙記録の記録用紙が出る */
#ending{align-items:center;justify-content:center;text-align:center;background:transparent;box-shadow:none;cursor:pointer;padding:calc(5 * var(--q))}
#endSkip{position:absolute;right:calc(5 * var(--q));bottom:calc(3.4 * var(--q));font-size:calc(3.6 * var(--q));font-weight:bold;color:#cfd6ff;opacity:.7;white-space:nowrap;letter-spacing:calc(.3 * var(--q))}
#ending.cert #endSkip{display:none}
#cert{display:none;width:100%;margin-top:calc(6 * var(--q));padding:calc(4 * var(--q)) calc(5.5 * var(--q)) calc(4.4 * var(--q));background:#fffdf2;border:calc(.7 * var(--q)) solid #2c4aa0;border-radius:calc(1.6 * var(--q));
  box-shadow:0 calc(2 * var(--q)) 0 #1c3170,0 calc(3 * var(--q)) calc(6 * var(--q)) #0006;color:#2b2b3a;flex-direction:column;align-items:stretch;gap:calc(1.7 * var(--q));text-align:center;cursor:default}
#ending.cert #cert{display:flex;animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
#cert .sub{align-self:center;font-size:calc(4.4 * var(--q));font-weight:900;color:#5a3d00;background:linear-gradient(#f9d878,#e0a828);border-radius:calc(5 * var(--q));padding:calc(.7 * var(--q)) calc(6 * var(--q));letter-spacing:calc(1 * var(--q));margin-top:calc(-8.4 * var(--q));box-shadow:0 calc(.7 * var(--q)) 0 #a87810;white-space:nowrap}
#cert .hd{font-size:calc(5.4 * var(--q));font-weight:bold;color:#2c4aa0;border-bottom:calc(.5 * var(--q)) solid #2c4aa0;padding-bottom:calc(1.2 * var(--q));letter-spacing:calc(.5 * var(--q));white-space:nowrap}
#cert .ln{display:flex;justify-content:space-between;align-items:baseline;font-size:calc(4.2 * var(--q));border-bottom:calc(.3 * var(--q)) dashed #9aa7d0;padding-bottom:calc(.8 * var(--q));white-space:nowrap}
#cert .ln span:first-child{color:#55608a}
#cert .ln b{font-size:calc(4.6 * var(--q))}
#cert .big{position:relative;display:flex;justify-content:space-between;align-items:center;margin:calc(.8 * var(--q)) 0 calc(2.2 * var(--q))}
#cert .big .lb{font-size:calc(4.8 * var(--q));color:#55608a;font-weight:bold}
#cert .big .num{font-size:calc(12 * var(--q));font-weight:900;line-height:1;color:#d2382f;font-variant-numeric:tabular-nums}
#cert .big .num small{font-size:calc(5 * var(--q));color:#55608a;font-weight:bold;margin-left:calc(.8 * var(--q))}
#cStamp{position:absolute;left:calc(15 * var(--q));top:calc(-2.4 * var(--q));width:calc(19 * var(--q));height:calc(19 * var(--q));border:calc(.9 * var(--q)) solid #d2382f;border-radius:50%;color:#d2382f;font-weight:900;
  display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;transform:rotate(-14deg) scale(2.4);opacity:0;background:#fffdf277;font-size:calc(4.8 * var(--q))}
#cStamp.on{animation:stamp .28s cubic-bezier(.4,1.6,.6,1) forwards}
#cert .note{font-size:calc(4 * var(--q));font-weight:bold;color:#2c4aa0;line-height:1.5}
#endBtn{flex:1.2;height:calc(12.5 * var(--q));font-size:calc(4.8 * var(--q));white-space:nowrap}
#endShare{flex:1;height:calc(10 * var(--q));font-size:calc(3.5 * var(--q));background:transparent;color:#2c4aa0;white-space:nowrap;padding:0 calc(1.5 * var(--q));border:calc(.6 * var(--q)) solid #2c4aa0;border-radius:calc(3 * var(--q));box-shadow:0 calc(.6 * var(--q)) 0 #2c4aa066}
#endShare:active{transform:translateY(calc(.5 * var(--q)))}

/* 結果：体力測定の記録用紙 */
#result{position:absolute;left:calc(6 * var(--q));right:calc(6 * var(--q));top:calc(21 * var(--q));z-index:30;padding:calc(4 * var(--q)) calc(5.5 * var(--q)) calc(4.2 * var(--q));
  background:#fffdf2;border:calc(.7 * var(--q)) solid #2c4aa0;border-radius:calc(1.6 * var(--q));
  box-shadow:0 calc(2 * var(--q)) 0 #1c3170,0 calc(3 * var(--q)) calc(6 * var(--q)) #0006;
  color:#2b2b3a;display:none;flex-direction:column;align-items:stretch;gap:calc(1.6 * var(--q));text-align:center;pointer-events:auto}
#result.show{display:flex;animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
#result.wait{pointer-events:none}
@keyframes pop{from{transform:scale(.7) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
#result .hd{font-size:calc(5.2 * var(--q));font-weight:bold;color:#2c4aa0;border-bottom:calc(.5 * var(--q)) solid #2c4aa0;padding-bottom:calc(1.2 * var(--q));letter-spacing:calc(.5 * var(--q));white-space:nowrap}
#result .ln{display:flex;justify-content:space-between;align-items:baseline;font-size:calc(4.2 * var(--q));
  border-bottom:calc(.3 * var(--q)) dashed #9aa7d0;padding-bottom:calc(.8 * var(--q));white-space:nowrap}
#result .ln span:first-child{color:#55608a}
#result .ln b{font-size:calc(4.6 * var(--q))}
#result .big{position:relative;display:flex;justify-content:space-between;align-items:center;margin:calc(.6 * var(--q)) 0 calc(1.6 * var(--q))}
#result .big .lb{font-size:calc(4.8 * var(--q));color:#55608a;font-weight:bold}
#result .big .num{font-size:calc(12 * var(--q));font-weight:900;line-height:1;color:#d2382f;font-variant-numeric:tabular-nums}
#result .big .num small{font-size:calc(5 * var(--q));color:#55608a;font-weight:bold;margin-left:calc(.8 * var(--q))}
#stamp{position:absolute;left:calc(11.5 * var(--q));top:calc(-2.5 * var(--q));width:calc(19 * var(--q));height:calc(19 * var(--q));border:calc(.9 * var(--q)) solid #d2382f;border-radius:50%;
  color:#d2382f;font-weight:900;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;
  transform:rotate(-14deg) scale(2.4);opacity:0;background:#fffdf277;font-size:calc(10 * var(--q))}
#stamp.long{font-size:calc(4.2 * var(--q))}
#stamp.on{animation:stamp .28s cubic-bezier(.4,1.6,.6,1) forwards}
@keyframes stamp{to{transform:rotate(-14deg) scale(1);opacity:1}}
#rJudge{font-size:calc(3.8 * var(--q));color:#55608a;min-height:calc(4.8 * var(--q))}
#rBest{font-size:calc(3.6 * var(--q));color:#55608a;min-height:calc(4.6 * var(--q))}

/* ライバルとの比べ。勝ち負けの判子が真ん中に押される */
#vs{display:grid;grid-template-columns:minmax(0,1fr) calc(19 * var(--q)) minmax(0,1fr);align-items:center;background:#f1f4fc;border:calc(.4 * var(--q)) solid #9aa7d0;border-radius:calc(1.6 * var(--q));padding:calc(2 * var(--q)) calc(1.6 * var(--q))}
#vs .col{display:flex;flex-direction:column;gap:calc(.4 * var(--q));min-width:0}
#vs .col span{font-size:calc(3.4 * var(--q));color:#55608a;font-weight:bold;white-space:nowrap}
#vs .col b{font-size:calc(7 * var(--q));font-weight:900;line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums}
#vs .col b.l2{font-size:calc(5.2 * var(--q))}
#vs .col b.l3{font-size:calc(4.2 * var(--q))}
#vs .col.you b{color:#d2382f}
#vs .mid{position:relative;height:calc(15 * var(--q));display:flex;align-items:center;justify-content:center}
#vs .mid .v{font-size:calc(4 * var(--q));font-weight:900;color:#9aa7d0}
#vsStamp{position:absolute;left:50%;top:50%;margin:calc(-7.5 * var(--q)) 0 0 calc(-8.5 * var(--q));width:calc(17 * var(--q));height:calc(15 * var(--q));border:calc(.8 * var(--q)) solid #d2382f;border-radius:calc(2 * var(--q));
  color:#d2382f;font-weight:900;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.05;white-space:nowrap;
  transform:rotate(-10deg) scale(2.4);opacity:0;background:#fffdf2d0;font-size:calc(5 * var(--q))}
#vs.lose #vsStamp{color:#4a5a9a;border-color:#4a5a9a}

@keyframes vstamp{to{transform:rotate(-10deg) scale(1);opacity:1}}
#vsSay{grid-column:1/-1;margin-top:calc(1.4 * var(--q));padding-top:calc(1.3 * var(--q));border-top:calc(.3 * var(--q)) dashed #9aa7d0;font-size:calc(3.6 * var(--q));color:#2b2b3a;text-align:center;line-height:1.35;min-height:calc(4.8 * var(--q))}
#vsSay .who{font-weight:900;color:#55608a;margin-right:calc(1.2 * var(--q))}
#vsNote{font-size:calc(3.9 * var(--q));font-weight:bold;color:#2c4aa0;min-height:calc(5 * var(--q))}

.row{display:flex;gap:calc(3 * var(--q));align-items:center;width:100%;margin-top:calc(.6 * var(--q))}
.btn{border:0;border-radius:calc(3.6 * var(--q));font:inherit;font-weight:bold;color:#fff;cursor:pointer;
  background:linear-gradient(#ff6b9a,#e0356f);box-shadow:0 calc(1.2 * var(--q)) 0 #a82350;touch-action:manipulation}
.btn:active{transform:translateY(calc(.8 * var(--q)));box-shadow:0 calc(.4 * var(--q)) 0 #a82350}
#retry{flex:1;height:calc(13 * var(--q));font-size:calc(5.8 * var(--q));white-space:nowrap}
#toList,#rShop,#share{height:calc(10 * var(--q));font-size:calc(3.5 * var(--q));background:transparent;color:#2c4aa0;white-space:nowrap;padding:0 calc(1.5 * var(--q));
  border:calc(.6 * var(--q)) solid #2c4aa0;border-radius:calc(3 * var(--q));box-shadow:0 calc(.6 * var(--q)) 0 #2c4aa066}
#toList{flex:1.15}
#rShop{flex:1}
#share{width:calc(23 * var(--q))}
#rShop.hot{background:#fff0f5;border-color:#e0356f;color:#c4235c}

/* キーボードで選んでいるボタンの目印（Tab・矢印・Enter／Space で遊べる） */
button:focus{outline:none}
button:focus-visible{outline:calc(.7 * var(--q)) solid #ffcf2a;outline-offset:calc(.5 * var(--q));box-shadow:0 0 0 calc(1.1 * var(--q)) #2c4aa0}
.tn:focus-visible,.it .buy:focus-visible{z-index:2}

/* ===== English：言葉が長いので、文字を少し小さく・字間をつめる ===== */
html[lang=en] body{font-family:"Arial Rounded MT Bold","Trebuchet MS","Segoe UI","Hiragino Maru Gothic ProN","Yu Gothic UI",sans-serif;word-break:normal;line-break:auto}
html[lang=en] #title .tag{font-size:calc(4 * var(--q));letter-spacing:calc(.5 * var(--q))}
html[lang=en] #title .logo .l1{font-size:calc(21 * var(--q));letter-spacing:calc(.4 * var(--q))}

html[lang=en] .tn .nm{font-size:calc(4.2 * var(--q))}
html[lang=en] .tn .sb{font-size:calc(3 * var(--q))}

html[lang=en] #result .big .lb,html[lang=en] #cert .big .lb{font-size:calc(4.2 * var(--q))}
html[lang=en] #stamp.long{font-size:calc(3.6 * var(--q))}
html[lang=en] #cStamp{font-size:calc(3.5 * var(--q))}
html[lang=en] #vsStamp{font-size:calc(4.4 * var(--q))}

html[lang=en] #endBtn{font-size:calc(4.2 * var(--q))}
html[lang=en] #endShare{font-size:calc(3.2 * var(--q))}
html[lang=en] #listBack,html[lang=en] #inBack,html[lang=en] #shopBack{font-size:calc(3.5 * var(--q))}
html[lang=en] #shopGo{font-size:calc(4.6 * var(--q))}
html[lang=en] .t4,html[lang=en] #intro .go{letter-spacing:calc(.3 * var(--q))}

/* English・縦画面：判子が左の見出し（Record）にかからないよう、少し右へ */
@media (max-aspect-ratio:124/100){
  html[lang=en] #stamp{left:calc(14.5 * var(--q));width:calc(17 * var(--q));height:calc(17 * var(--q))}
  html[lang=en] #cStamp{left:calc(17 * var(--q));width:calc(17 * var(--q));height:calc(17 * var(--q))}
}

/* ===== 横画面（パソコン・横向きのスマホ）：16:9 の枠いっぱいに、横に並べた画面にする。単位 --q は枠の幅の 1/220 ===== */
@media (min-aspect-ratio:5/4){
  #stage{width:min(100vw,calc(100dvh*16/9));aspect-ratio:16/9;--q:.4545cqw}
  /* タイトル：ロゴは 1 行（分身＋反復横とび）、案内は下 */
  #title .head{top:calc(8 * var(--q));gap:calc(2 * var(--q))}
  #title .logo{flex-direction:row;align-items:baseline;gap:calc(2.4 * var(--q))}
  #title .logo .l1{font-size:calc(31 * var(--q))}
  #title .logo .l2{font-size:calc(21 * var(--q));margin-top:0}
  html[lang=en] #title .logo .l1{font-size:calc(25 * var(--q))}
  html[lang=en] #title .logo .l2{font-size:calc(19 * var(--q))}
  #title .tag{font-size:calc(4.6 * var(--q))}
  #title .catch{font-size:calc(5.4 * var(--q));margin-top:calc(.6 * var(--q))}
  #title .t4{top:calc(108 * var(--q));font-size:calc(6.4 * var(--q))}

  .scr{padding:calc(6 * var(--q)) calc(9 * var(--q)) calc(5 * var(--q));gap:calc(3 * var(--q))}
  /* 大会の一覧：上に見出しと券、まん中に 3×3 のカード、下にもどる */
  #list.on{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto minmax(0,1fr) auto;align-items:end}
  #list .hd{grid-column:1;font-size:calc(6.4 * var(--q))}
  #list .bar{grid-column:2;gap:calc(5 * var(--q));align-self:center}
  #list .bar .tk{font-size:calc(4 * var(--q))}
  #list .bar .tk b{font-size:calc(5.2 * var(--q))}
  #list .sm{height:calc(8 * var(--q));padding:0 calc(5 * var(--q));font-size:calc(3.8 * var(--q));border-radius:calc(2.6 * var(--q))}
  #listBody{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:calc(3.6 * var(--q));padding:calc(1 * var(--q)) calc(1.4 * var(--q)) calc(1.6 * var(--q));align-self:stretch}
  #listBody .tn{max-height:none;min-height:0;grid-template-columns:calc(9 * var(--q)) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"no mid" "rt rt";row-gap:calc(1 * var(--q));padding:calc(2 * var(--q)) calc(3 * var(--q)) calc(2 * var(--q)) calc(2.6 * var(--q))}
  #listBody .tn .no{grid-area:no;width:calc(9 * var(--q));height:calc(9 * var(--q));font-size:calc(5 * var(--q));align-self:center}
  #listBody .tn .mid{grid-area:mid;align-self:center;gap:calc(.8 * var(--q))}
  #listBody .tn .rt{grid-area:rt;flex-direction:row;justify-content:space-between;align-items:center;border-top:calc(.3 * var(--q)) dashed #c3cadf;padding-top:calc(1.2 * var(--q))}
  #listBody .tn .nm{font-size:calc(4.6 * var(--q))}
  #listBody .tn .sb{font-size:calc(3.3 * var(--q))}
  #listBody .tn .tag{font-size:calc(3.2 * var(--q))}
  #listBody .tn .bs{font-size:calc(3.2 * var(--q))}
  html[lang=en] #listBody .tn .nm{font-size:calc(4.1 * var(--q))}
  html[lang=en] #listBody .tn .sb,html[lang=en] #listBody .tn .tag,html[lang=en] #listBody .tn .bs{font-size:calc(3 * var(--q))}
  #list .back,#intro .back{height:calc(8 * var(--q));padding:0 calc(7 * var(--q));font-size:calc(3.6 * var(--q));border-radius:calc(2.6 * var(--q))}
  #list .back{grid-column:1/-1;justify-self:center}

  /* 購買部：2 列 × 3 行 */
  #shop.on{display:grid;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto}
  #shop .hd{font-size:calc(6.4 * var(--q))}
  #shop .hd small{font-size:calc(4 * var(--q))}
  #shop .hd small b{font-size:calc(5.2 * var(--q))}
  #shopBody{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:calc(3.4 * var(--q));align-self:stretch}
  #shopBody .it{max-height:none;min-height:0;grid-template-columns:minmax(0,1fr) calc(30 * var(--q));column-gap:calc(3 * var(--q));padding:0 calc(3 * var(--q)) 0 calc(4 * var(--q))}
  #shopBody .it .nm{font-size:calc(4.6 * var(--q))}
  #shopBody .it .pips{font-size:calc(3.2 * var(--q))}
  #shopBody .it .ds{font-size:calc(3.5 * var(--q))}
  #shopBody .it .fx{font-size:calc(3.5 * var(--q))}
  #shopBody .it .buy{height:calc(12 * var(--q));font-size:calc(5.2 * var(--q));border-radius:calc(3 * var(--q))}
  html[lang=en] #shopBody .it .nm{font-size:calc(4.3 * var(--q))}
  html[lang=en] #shopBody .it .ds{font-size:calc(3.3 * var(--q))}
  html[lang=en] #shopBody .it .fx{font-size:calc(3.2 * var(--q))}
  html[lang=en] #shopBody .it .buy{font-size:calc(4.6 * var(--q))}
  #shop .row{width:calc(110 * var(--q));margin:0 auto;gap:calc(5 * var(--q))}
  #shopBack{height:calc(9 * var(--q));font-size:calc(4 * var(--q))}
  #shopGo{height:calc(10.5 * var(--q));font-size:calc(5.4 * var(--q))}
  html[lang=en] #shopBack{font-size:calc(3.8 * var(--q))}
  html[lang=en] #shopGo{font-size:calc(4.8 * var(--q))}

  /* 測定前（ライバルの紹介）：カードは左にライバル・右に記録の 2 列 */
  #intro{left:calc(34 * var(--q));right:calc(34 * var(--q));top:calc(37 * var(--q));gap:calc(2.6 * var(--q))}
  #inName{font-size:calc(4.8 * var(--q))}
  #inCard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.85fr);column-gap:calc(5 * var(--q));row-gap:calc(1.2 * var(--q));padding:calc(3.4 * var(--q)) calc(5 * var(--q)) calc(3.8 * var(--q));align-items:center;justify-items:center}
  #inCard > :nth-child(1){grid-column:1;grid-row:1}
  #inCard > :nth-child(2){grid-column:1;grid-row:2}
  #inCard > :nth-child(3){grid-column:1;grid-row:3;margin:0}
  #inCard > :nth-child(4){display:none}
  #inCard > :nth-child(5){grid-column:2;grid-row:1}
  #inCard > :nth-child(6){grid-column:2;grid-row:2}
  #inCard > :nth-child(7){grid-column:2;grid-row:3}
  #inCard .lb{font-size:calc(3.3 * var(--q))}
  #inRival{font-size:calc(7.2 * var(--q))}
  #inSay{font-size:calc(3.9 * var(--q))}
  #inRec{font-size:calc(17 * var(--q))}
  #inRec small{font-size:calc(4.8 * var(--q))}
  #inBest{font-size:calc(3.4 * var(--q))}
  #intro .go{font-size:calc(5.6 * var(--q));padding:calc(1.8 * var(--q)) calc(8 * var(--q))}
  html[lang=en] #inRival{font-size:calc(5.8 * var(--q))}
  html[lang=en] #inSay{font-size:calc(3.6 * var(--q))}

  /* 記録用紙：左に記録・右にライバルとの比べ。ボタンは下に横ならび */
  #result{left:calc(31 * var(--q));right:calc(31 * var(--q));top:calc(8 * var(--q));padding:calc(3.4 * var(--q)) calc(6 * var(--q)) calc(3.6 * var(--q));gap:calc(1.8 * var(--q)) calc(7 * var(--q))}
  #result.show{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    grid-template-areas:"hd hd" "kind vs" "big vs" "judge vnote" "tk steps" "max trips" "best best" "retry retry" "btns btns";align-items:center}
  #result .r-hd{grid-area:hd;font-size:calc(4.8 * var(--q))}
  #result .r-kind{grid-area:kind}
  #result .r-big{grid-area:big;margin:calc(1 * var(--q)) 0;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;row-gap:calc(.4 * var(--q))}
  #result .r-big .lb{grid-column:1/-1;grid-row:1;text-align:left}
  #result .r-big .num{grid-column:2;grid-row:2;justify-self:end}
  #rJudge{grid-area:judge}
  #vs{grid-area:vs;align-self:stretch}
  #vsNote{grid-area:vnote}
  #result .r-tk{grid-area:tk}
  #result .r-steps{grid-area:steps}
  #result .r-max{grid-area:max}
  #result .r-trips{grid-area:trips}
  #rBest{grid-area:best}
  #result .r-retry{grid-area:retry;justify-content:center}
  #result .r-btns{grid-area:btns;justify-content:center}
  #result .ln{font-size:calc(3.8 * var(--q))}
  #result .ln b{font-size:calc(4.2 * var(--q))}
  #result .big .lb{font-size:calc(4.2 * var(--q))}
  #result .big .num{font-size:calc(11.5 * var(--q))}
  #result .big .num small{font-size:calc(4.6 * var(--q))}
  #stamp{left:calc(.5 * var(--q));top:calc(3.4 * var(--q));width:calc(15.5 * var(--q));height:calc(15.5 * var(--q));font-size:calc(8.4 * var(--q))}
  #stamp.long{font-size:calc(3.6 * var(--q))}
  html[lang=en] #stamp.long{font-size:calc(3.1 * var(--q))}
  #vs{grid-template-columns:minmax(0,1fr) calc(17 * var(--q)) minmax(0,1fr);padding:calc(2.4 * var(--q)) calc(2 * var(--q))}
  #vs .col span{font-size:calc(3.2 * var(--q))}
  #vs .col b{font-size:calc(6.6 * var(--q))}
  #vs .col b.l2{font-size:calc(5 * var(--q))}
  #vs .col b.l3{font-size:calc(4 * var(--q))}
  #vsStamp{width:calc(15.5 * var(--q));height:calc(13.5 * var(--q));margin:calc(-6.75 * var(--q)) 0 0 calc(-7.75 * var(--q));font-size:calc(4.6 * var(--q))}
  #vsSay{font-size:calc(3.4 * var(--q))}
  #vsNote{font-size:calc(3.8 * var(--q))}
  #rJudge{font-size:calc(3.5 * var(--q))}
  #rBest{font-size:calc(3.4 * var(--q))}
  #retry{flex:none;width:calc(70 * var(--q));height:calc(11 * var(--q));font-size:calc(5.4 * var(--q));border-radius:calc(3.2 * var(--q))}
  #toList,#rShop,#share{height:calc(8.6 * var(--q));font-size:calc(3.5 * var(--q));padding:0 calc(5 * var(--q))}
  #toList,#rShop{flex:none}
  #share{width:auto}
  html[lang=en] #retry{font-size:calc(5 * var(--q))}
  html[lang=en] #toList,html[lang=en] #rShop,html[lang=en] #share{font-size:calc(3.3 * var(--q))}
  html[lang=en] #vsStamp{font-size:calc(4 * var(--q))}

  /* エンディングの記録用紙（宇宙記録）*/
  #ending{padding:calc(4 * var(--q))}
  #endSkip{right:calc(8 * var(--q));bottom:calc(5 * var(--q));font-size:calc(3.6 * var(--q))}
  #cert{width:calc(150 * var(--q));margin-top:calc(5 * var(--q));padding:calc(3.4 * var(--q)) calc(6 * var(--q)) calc(3.6 * var(--q));
    display:none;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:calc(1.8 * var(--q)) calc(7 * var(--q));
    grid-template-areas:"sub sub" "hd hd" "kind big" "tn big" "who note" "wit note" "row row";align-items:center}
  #ending.cert #cert{display:grid}
  #cert .sub{grid-area:sub;justify-self:center;margin-top:calc(-7.4 * var(--q));font-size:calc(4 * var(--q))}
  #cert .hd{grid-area:hd;font-size:calc(4.8 * var(--q))}
  #cert .c-kind{grid-area:kind}
  #cert .c-tn{grid-area:tn}
  #cert .c-big{grid-area:big;margin:0;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;row-gap:calc(.4 * var(--q))}
  #cert .c-big .lb{grid-column:1/-1;grid-row:1;text-align:left}
  #cert .c-big .num{grid-column:2;grid-row:2;justify-self:end}
  #cert .c-who{grid-area:who}
  #cert .c-wit{grid-area:wit}
  #cert .c-note{grid-area:note;flex-direction:column;align-items:flex-start;gap:calc(1 * var(--q));text-align:left;border-bottom:0}
  #cert .c-row{grid-area:row;justify-content:center;margin-top:calc(1 * var(--q))}
  #cert .ln{font-size:calc(3.8 * var(--q))}
  #cert .ln b{font-size:calc(4.2 * var(--q))}
  #cert .note{font-size:calc(3.8 * var(--q))}
  #cert .big .lb{font-size:calc(4.2 * var(--q))}
  #cert .big .num{font-size:calc(10 * var(--q))}
  #cert .big .num small{font-size:calc(4.4 * var(--q))}
  #cStamp{left:calc(.5 * var(--q));top:calc(3 * var(--q));width:calc(13.5 * var(--q));height:calc(13.5 * var(--q));font-size:calc(3.4 * var(--q))}
  html[lang=en] #cStamp{font-size:calc(2.7 * var(--q))}
  #endBtn{flex:none;width:calc(62 * var(--q));height:calc(10 * var(--q));font-size:calc(4.6 * var(--q))}
  #endShare{flex:none;width:auto;height:calc(8.6 * var(--q));padding:0 calc(5 * var(--q));font-size:calc(3.5 * var(--q))}
  html[lang=en] #endBtn{font-size:calc(4.2 * var(--q))}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="stage">
  <div id="title">
    <div class="head">
      <div class="tag" data-s="title.tag"></div>
      <div class="logo"><span class="l1" id="logo1"></span><span class="l2" id="logo2"></span></div>
      <div class="catch" data-p="title.catch"></div>
    </div>
    <div class="t4" data-s="title.tap"></div>
  </div>
  <div id="list" class="scr">
    <div class="hd"><span data-s="list.head"></span><small id="listProg"></small></div>
    <div class="bar"><span class="tk"><span data-s="list.tickets"></span><b id="listTk"></b></span><button id="toShop" class="btn sm" data-s="list.shop"></button></div>
    <div id="listBody"></div>
    <button id="listBack" class="btn back" data-s="list.back"></button>
  </div>
  <div id="shop" class="scr">
    <div class="hd"><span data-s="shop.head"></span><small><span data-s="shop.tickets"></span><b id="shopTk"></b></small></div>
    <div id="shopBody"></div>
    <div class="row"><button id="shopBack" class="btn" data-s="shop.back"></button><button id="shopGo" class="btn" data-s="shop.go"></button></div>
  </div>
  <div id="intro">
    <div id="inName"></div>
    <div id="inCard">
      <div class="lb" data-s="intro.rival"></div>
      <div id="inRival"></div>
      <div id="inSay"></div>
      <div class="rule"></div>
      <div class="lb" data-s="intro.rec"></div>
      <div id="inRec"></div>

STR_JA.num = { units: [[1e4, '万'], [1e8, '億'], [1e12, '兆']], sep: ',', sig: 4, from: 1e4 };
STR_EN.num = { units: [[1e3, 'K'], [1e6, 'M'], [1e9, 'B']], sep: ',', sig: 4, from: 1e4 };
const STRS = { ja: STR_JA, en: STR_EN };
const STR = STRS[LANG];

// 「|」を、日本語では何もなし・英語では空白にした普通の文字列
const STRSEP = EN ? ' ' : '';
const phL = (s, lang) => s.replace(/\|/g, lang === 'en' ? ' ' : '');
const ph = s => s.replace(/\|/g, STRSEP);

// ===== 大きな数字の表示（ここ 1 か所）=====
// 日本語：1 万未満はカンマ、1 万以上は 万・億・兆。英語：1 万（10,000）未満はカンマ、以上は K / M / B。
// どちらも有効数字 4 桁まで・最大 6 文字（例 12.34万・123.4万・1234万・1.5億／12.35K・123.5K・1.235M）。lang を省くと今の言語
function fmtNum(v, lang) {
  let n = Math.round(Number(v));
  if (!Number.isFinite(n)) return '0';
  const neg = n < 0; if (neg) n = -n;
  const N = STRS[lang === 'ja' || lang === 'en' ? lang : LANG].num, U = N.units;   // map(fmtNum) のように添字が渡っても無視
  let out;
  if (n < N.from) {
    out = String(n).replace(/\B(?=(\d{3})+(?!\d))/g, N.sep);
  } else {
    let u = 0;
    while (u + 1 < U.length && n >= U[u + 1][0]) u++;
    const body = k => {   // 有効数字 sig 桁に丸めて、余分な 0 を落とす
      const m = n / U[k][0], d = Math.max(0, N.sig - 1 - Math.floor(Math.log10(m)));
      return Number(m.toFixed(d));
    };
    let m = body(u);
    if (u + 1 < U.length && m >= U[u + 1][0] / U[u][0]) { u++; m = body(u); }   // 9999.6万 → 1億、999.96K → 1M のような繰り上がり
    out = String(m) + U[u][1];
  }
  return neg ? '-' + out : out;
}

// エンディングの長さ（秒）。3 つの場面のあとに記録用紙（宇宙記録）が出る。タップでとばせる
const ENDING_TIMES = { galaxy: 5.2, sheet: 5.2, teacher: 5.6 };
const endingTotal = () => ENDING_TIMES.galaxy + ENDING_TIMES.sheet + ENDING_TIMES.teacher;

// ===== 横画面：レーンと分身の立つ場所（画面を使わない。描くのは 40-render.js）=====
// レーン＝右左左右の 3 本線のひとまとまり。縦画面は 1 つ、横に広いほど増える（本人はまん中）。LANE_W は床の線 1 間隔を 1 としたレーンの間隔
const LANE_W = 2.6;
// wide＝画面の幅（遊ぶ場所の幅 100 を単位に）、step＝床の線 1 間隔（40-render の LS）。レーンの数は 1・3・5・7
function lanesFor(wide, step) {
  const m = Math.floor((wide / 2 - 8) / (LANE_W * step));
  return (m >= 0 ? Math.min(3, m) : 0) * 2 + 1;
}
// 本人のレーンが先頭、そのあと左右へ 1 つずつ（0, -1, 1, -2, 2 …）
function laneOrder(n) { const o = [0]; for (let j = 1; o.length < n; j++) o.push(-j, j); return o.slice(0, n); }
// 分身 count 人の立つ場所。1 レーンは今までどおり（奥へ 3 人ずつ）。複数レーンは、1 行目が本人の横（本人のレーンはあけておく）・2 行目から全レーンで、ずらして立つ
function buildSlots(lanes, count) {
  const out = [], L = laneOrder(lanes);
  for (let i = 0; out.length < count; i++) {
    if (lanes === 1) { out.push({ z: 1 + Math.floor(i / 3), lane: 0, wx: (i % 3 - 1) * 0.3 }); continue; }
    const first = L.length - 1;
    if (i < first) { out.push({ z: 0, lane: L[i + 1], wx: 0 }); continue; }
    const j = i - first, z = 1 + Math.floor(j / lanes), idx = j % lanes;
    out.push({ z, lane: L[idx], wx: ((z + idx) % 3 - 1) * 0.28 });
  }
  return out;
}
// ===== ゲームのロジック（画面を使わない）=====
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// 位置: 0=左の線 1=中央 2=右の線。side: -1=左をタップ 1=右をタップ
const Game = {
  mode: 'title',   // title → ready → play → finish → over
  t: 0, readyT: 0, finT: 0, seed: 1, rand: null,
  pos: 1, lastSide: 0, xv: 0, stun: 0,
  stepTimes: [], rate: 0, lvl: 0, upT: 0, downT: 0,
  rec: 0, recF: 0, steps: 0, trips: 0, maxN: 1, maxLvl: 0,
  events: [],

  reset(seed) {
    this.seed = seed == null ? (Date.now() & 0xffff) : seed;
    this.rand = mulberry32(this.seed);
    this.mode = 'title';
    this.t = 0; this.readyT = 0; this.finT = 0;
    this.pos = 1; this.lastSide = 0; this.xv = 0; this.stun = 0;
    this.stepTimes = []; this.rate = 0; this.lvl = 0; this.upT = 0; this.downT = 0;
    this.rec = 0; this.recF = 0; this.steps = 0; this.trips = 0; this.maxN = 1; this.maxLvl = 0;
    this.events = [];
  },

  begin() {
    if (this.mode !== 'title') return;
    this.mode = 'ready'; this.readyT = 0;
    this.events.push({ type: 'ready' });
  },

  bodies() { return CFG.bodies[this.lvl]; },

  // 次にタップしてよい側（-1/1）の一覧
  nextSides() {
    if (this.pos === 1) return this.lastSide === 0 ? [-1, 1] : [-this.lastSide];
    return [this.pos === 0 ? 1 : -1];
  },
  // 次に光らせる線（0/1/2）の一覧
  nextLines() {
    if (this.pos === 1) return this.nextSides().map(s => 1 + s);
    return [1];
  },

  // 左右のタップ。'step' 正しく跳んだ / 'trip' 転んだ / 'stun' 転んで動けない間 / 'ignored'
  input(side) {
    if (this.mode !== 'play') return 'ignored';
    if (this.stun > 0) return 'stun';
    let ok;
    if (this.pos === 1) ok = this.lastSide === 0 || side !== this.lastSide;   // 中央から、さっき行った側へまた跳ぶと転ぶ
    else ok = side === (this.pos === 0 ? 1 : -1);                             // 外の線から外へ跳ぶとはみ出して転ぶ
    if (ok) {
      if (this.pos === 1) { this.pos = 1 + side; this.lastSide = side; }
      else this.pos = 1;
      const n = this.bodies();
      this.steps++;
      this.recF += n * CFG.recMul;   // 記録の倍率（購買部）。小数のぶんは持ち越す
      const gain = Math.floor(this.recF + 1e-9) - this.rec;
      this.rec += gain;
      this.stepTimes.push(this.t);
      this.events.push({ type: 'step', n, gain, side, pos: this.pos });
      return 'step';
    }
    const was = this.lvl;
    this.trips++;
    this.stun = CFG.stunSecs;
    this.stepTimes.length = 0; this.rate = 0;
    this.lvl = Math.max(0, this.lvl - CFG.stunDrop);
    this.upT = 0; this.downT = 0;
    const wrongPos = this.pos;
    this.pos = 1;   // 転んだあとは中央から（lastSide は残すので、次は反対側へ行けばリズムがつながる）
    this.events.push({ type: 'trip', was, lvl: this.lvl, from: wrongPos, side, want: this.nextSides() });
    return 'trip';
  },

  candidate(rate) {
    let c = 0;
    for (let i = 0; i < CFG.levelRate.length; i++) if (rate >= CFG.levelRate[i]) c = i;
    return c;
  },

  step(dt) {
    this.xv += ((this.pos - 1) - this.xv) * (1 - Math.exp(-dt * CFG.hopK));
    if (this.mode === 'ready') {
      this.readyT += dt;
      if (this.readyT >= CFG.readySecs) {
        this.mode = 'play'; this.t = 0; this.events.push({ type: 'start' });
        if (CFG.startLvl > 0) {   // 応援団：はじめから高い段階
          this.lvl = Math.min(CFG.startLvl, CFG.levelRate.length - 1);
          this.maxLvl = this.lvl; this.maxN = Math.max(this.maxN, this.bodies());
          this.events.push({ type: 'lvl', up: true, lvl: this.lvl });
        }
      }
      return;
    }
    if (this.mode === 'finish') {
      this.finT += dt;
      if (this.finT >= CFG.finishSecs) { this.mode = 'over'; this.events.push({ type: 'over' }); }
      return;
    }
    if (this.mode !== 'play') return;
    this.t += dt;
    if (this.stun > 0) this.stun = Math.max(0, this.stun - dt);

    // 勢い：直近の歩を重みつきで数える（新しいほど重い）
    let sum = 0;
    const st = this.stepTimes;
    while (st.length && this.t - st[0] >= CFG.winEnd) st.shift();
    for (let i = 0; i < st.length; i++) {
      const age = this.t - st[i];
      sum += age <= CFG.winFull ? 1 : clamp((CFG.winEnd - age) / (CFG.winEnd - CFG.winFull), 0, 1);
    }
    this.rate = sum;

    const cand = this.candidate(this.rate);
    if (cand > this.lvl) {
      this.upT += dt; this.downT = 0;
      if (this.upT >= CFG.upHold) {
        this.lvl++; this.upT = 0;
        this.maxLvl = Math.max(this.maxLvl, this.lvl);
        this.maxN = Math.max(this.maxN, this.bodies());
        this.events.push({ type: 'lvl', up: true, lvl: this.lvl });
      }
    } else if (cand < this.lvl) {
      this.upT = 0;
      if (this.t < CFG.startGrace) this.downT = 0;   // はじめの少しのあいだは落ちない
      else if (this.stun <= 0) {
        this.downT += dt;
        if (this.downT >= CFG.downHold) {
          this.lvl--; this.downT = 0;
          this.events.push({ type: 'lvl', up: false, lvl: this.lvl });
        }
      }
    } else { this.upT = 0; this.downT = 0; }

    if (this.t >= CFG.duration) {
      this.t = CFG.duration;
      this.mode = 'finish'; this.finT = 0;
      this.events.push({ type: 'end' });
    }
  },
};

// 判定（記録から）。名前は STR.judge（言語ごと。「|」は判子の中の改行位置）。judgeFor は「|」を取った名前
function judgeIdx(rec) {
  let j = 0;
  for (let i = 0; i < CFG.judge.length; i++) if (rec >= CFG.judge[i][0]) j = i;
  return j;
}
function judgeRaw(rec) { return STR.judge[judgeIdx(rec)]; }
function judgeFor(rec) { return ph(judgeRaw(rec)); }
// ===== 購買部と引換券（画面を使わない）=====
// 強化の段階は保存の up（品物ごと 0〜最大）。測定のはじめに Shop.apply(save) が CFG へ掛け算・足し算で反映する。
// Shop.apply は「素の値」から計算し直すので、何度呼んでも重ならない。20-logic.js の仕組みは変えない
const SHOP_IDS = ['shoes', 'clothes', 'fall', 'recorder', 'cheer', 'book'];

const Shop = {
  ids: SHOP_IDS,
  // 強化なしの素の値（読み込み時に控えておく）
  base: {
    winFull: CFG.winFull, winEnd: CFG.winEnd, levelRate: CFG.levelRate.slice(), bodies: CFG.bodies.slice(),
    stunSecs: CFG.stunSecs, stunDrop: CFG.stunDrop,
  },

  // 素の段階の体の数に、秘伝書で増えるぶんを足した一覧（表示用）
  allBodies() { return this.base.bodies.concat(CFG.bodiesExtra); },
  zeroUp() { const u = {}; for (const id of SHOP_IDS) u[id] = 0; return u; },
  maxLevel(id) { return CFG.shop[id].price.length; },
  level(save, id) { return clamp(Math.floor(Number(save.up && save.up[id])) || 0, 0, this.maxLevel(id)); },

  // 次の段階の値段（もう最大なら null）
  price(save, id) {
    const lv = this.level(save, id);
    return lv >= this.maxLevel(id) ? null : CFG.shop[id].price[lv];
  },
  // 次の段階を買うのに勝っておく大会の数（なければ 0）。秘伝書だけ
  gate(save, id) {
    const g = CFG.shop[id].gate;
    return g ? g[this.level(save, id)] || 0 : 0;
  },
  // 'max' 最大 ／ 'locked' 大会に勝ちが足りない ／ 'poor' 引換券が足りない ／ 'ok' 買える
  state(save, id) {
    const p = this.price(save, id);
    if (p == null) return 'max';
    if (Tourney.wonCount(save) < this.gate(save, id)) return 'locked';
    return (save.tickets || 0) >= p ? 'ok' : 'poor';
  },
  canBuy(save, id) { return this.state(save, id) === 'ok'; },
  // 買う。足りない・ロック・最大なら何も変えず、理由を返す
  buy(save, id) {
    const st = this.state(save, id);
    if (st !== 'ok') return { ok: false, reason: st };
    const p = this.price(save, id);
    save.tickets -= p;
    save.up[id] = this.level(save, id) + 1;
    return { ok: true, price: p, level: save.up[id] };
  },
  // いま買える中でいちばん安い品物（なければ null）。ボット用
  cheapest(save) {
    let best = null, bp = Infinity;
    for (const id of SHOP_IDS) if (this.canBuy(save, id)) { const p = this.price(save, id); if (p < bp) { bp = p; best = id; } }
    return best;
  },

  // 段階 lv のときの効果の値（画面の「いま → 次」の表示用）
  effect(id, lv) {
    const S = CFG.shop[id], B = this.base, k = lv - 1;
    switch (id) {
      case 'shoes': return { mul: lv > 0 ? S.mul[k] : 1 };
      case 'clothes': return { mul: lv > 0 ? S.mul[k] : 1 };
      case 'fall': return { drop: lv > 0 ? S.drop[k] : B.stunDrop, secs: lv > 0 ? S.secs[k] : B.stunSecs };
      case 'recorder': return { mul: lv > 0 ? S.mul[k] : 1 };
      case 'cheer': { const sl = lv > 0 ? S.lvl[k] : 0; return { lvl: sl, bodies: this.allBodies()[sl] }; }
      case 'book': return { bodies: this.allBodies()[B.bodies.length - 1 + lv] };
    }
  },

  // 強化を CFG に反映する（測定の前に毎回）
  apply(save) {
    const B = this.base, S = CFG.shop, lv = id => this.level(save, id);
    const sh = lv('shoes') ? S.shoes.mul[lv('shoes') - 1] : 1;
    CFG.winFull = B.winFull * sh; CFG.winEnd = B.winEnd * sh;
    const cl = lv('clothes') ? S.clothes.mul[lv('clothes') - 1] : 1;
    const tiers = lv('book');
    CFG.bodies = B.bodies.concat(CFG.bodiesExtra.slice(0, tiers));
    CFG.levelRate = B.levelRate.concat(CFG.levelRateExtra.slice(0, tiers)).map((r, i) => i === 0 ? 0 : r * cl);
    const fl = lv('fall');
    CFG.stunDrop = fl ? S.fall.drop[fl - 1] : B.stunDrop;
    CFG.stunSecs = fl ? S.fall.secs[fl - 1] : B.stunSecs;
    CFG.recMul = lv('recorder') ? S.recorder.mul[lv('recorder') - 1] : 1;
    const ch = lv('cheer');
    CFG.startLvl = ch ? Math.min(S.cheer.lvl[ch - 1], CFG.bodies.length - 1) : 0;
    CFG.startGrace = ch ? S.cheer.grace : 0;
  },
  // 強化なしの素の値に戻す（検証用）
  reset() { this.apply({ up: this.zeroUp() }); },

  // 1回の引換券。記録の一部（勝つと多め）＋ まだ勝っていない大会の参加賞（大会の目標に比例。遅い人でも進めるように）
  payout(rec, win, target, wasWon) {
    let t = rec > 0 ? Math.max(1, Math.floor(rec * (win ? CFG.payWin : CFG.payLose))) : 0;
    if (!wasWon && target > 0) t += Math.floor(target * CFG.payPart);
    return t;
  },
};
// ===== 大会のくり返し（画面を使わない）=====
// 保存の形：{ v, unlocked（遊べる一番先の大会 0始まり）, won[大会ごとの勝ち], best[大会ごとのベスト] }
// Phase 2 で tickets（引換券の残り）と up（品物ごとの強化の段階）を、Phase 4 で endingSeen（エンディングを最後まで見たか）を足した。知らない項目は読み書きしても消さない
const SAVE_KEY = 'hanpuku-yokotobi-save';
const V1_BEST_KEY = 'hanpuku-yokotobi-best';   // v1 のベスト（引き継ぎ用に読むだけ）
const SAVE_VER = 3;   // 1＝Phase 1（大会だけ）／2＝引換券と強化／3＝endingSeen（エンディングを見たか）

const Tourney = {
  count() { return CFG.targets.length; },
  target(i) { return CFG.targets[i]; },
  // ライバルに勝つ：記録が目標を「超える」こと（同じ数は負け）。目標は使うたびに CFG から読む
  beats(rec, i) { return rec > CFG.targets[i]; },

  newSave() {
    const n = this.count();
    return { v: SAVE_VER, unlocked: 0, won: new Array(n).fill(false), best: new Array(n).fill(0), tickets: 0, up: Shop.zeroUp(), endingSeen: false };
  },

  // どんな値が来ても、使える形に直す（壊れた保存・古い保存・手で書き換えた保存）
  sanitize(o) {
    const n = this.count(), s = this.newSave();
    if (!o || typeof o !== 'object') return s;
    const out = Object.assign({}, o);   // 知らない項目は残す
    const u = Math.floor(Number(o.unlocked));
    out.unlocked = Number.isFinite(u) ? clamp(u, 0, n - 1) : 0;
    out.won = s.won.map((_, i) => Array.isArray(o.won) && o.won[i] === true);
    out.best = s.best.map((_, i) => {
      const b = Array.isArray(o.best) ? Math.floor(Number(o.best[i])) : 0;
      return Number.isFinite(b) && b > 0 ? b : 0;
    });
    // つじつま：先へ進めているなら手前は勝っている／勝った大会の次は開いている
    for (let i = 0; i < out.unlocked; i++) out.won[i] = true;
    for (let i = 0; i < n; i++) if (out.won[i]) out.unlocked = Math.max(out.unlocked, Math.min(i + 1, n - 1));
    for (let i = 0; i < out.unlocked; i++) out.won[i] = true;
    // 引換券と強化（Phase 1 の保存にはないので、なければ 0）
    const tk = Math.floor(Number(o.tickets));
    out.tickets = Number.isFinite(tk) && tk > 0 ? tk : 0;
    out.up = Shop.zeroUp();
    for (const id of Shop.ids) {
      const l = Math.floor(Number(o.up && o.up[id]));
      out.up[id] = Number.isFinite(l) ? clamp(l, 0, Shop.maxLevel(id)) : 0;
    }
    // エンディングを見たか（版 2 までの保存にはないので false。全部勝っているのに false なら、次に大会の一覧を開いたとき 1 回だけ出る）
    out.endingSeen = o.endingSeen === true;
    out.v = SAVE_VER;
    return out;
  },

  // 'won' 勝った ／ 'next' 挑戦できる（まだ勝っていない） ／ 'locked' まだ
  status(save, i) {
    if (save.won[i]) return 'won';
    return i <= save.unlocked ? 'next' : 'locked';
  },
  playable(save, i) { return i >= 0 && i < this.count() && i <= save.unlocked; },
  focusIndex(save) { return save.unlocked; },
  wonCount(save) { return save.won.filter(Boolean).length; },
  allWon(save) { return save.won.length > 0 && save.won.every(Boolean); },
  // エンディングを出すか：9 大会ぜんぶ勝っていて、まだ最後まで見ていない（ページを閉じて見損ねても、次に出る）
  shouldShowEnding(save) { return this.allWon(save) && !save.endingSeen; },
  markEndingSeen(save) { save.endingSeen = true; },

  // 1回の結果を保存の形に反映する。勝てば次の大会が開く。遊べない大会は何も変えない
  record(save, i, rec) {
    const none = { win: false, isBest: false, prevBest: save.best[i] || 0, firstWin: false, unlockedNext: false, ending: false, gain: 0 };
    if (!this.playable(save, i)) return none;
    const prevBest = save.best[i] || 0;
    const isBest = rec > prevBest;
    if (isBest) save.best[i] = rec;
    const win = this.beats(rec, i), wasWon = !!save.won[i];
    let firstWin = false, unlockedNext = false;
    if (win) {
      firstWin = !save.won[i];
      save.won[i] = true;
      if (i + 1 < this.count() && save.unlocked < i + 1) { save.unlocked = i + 1; unlockedNext = true; }
    }
    const gain = Shop.payout(rec, win, CFG.targets[i], wasWon);   // 負けても引換券はもらえる（勝つと多め）
    save.tickets = (save.tickets || 0) + gain;
    return { win, isBest, prevBest, firstWin, unlockedNext, ending: firstWin && i === this.count() - 1, gain };
  },

  // 保存の読み込み。v2 の保存がなければ v1 のベストを最初の大会のベストとして引き継ぐ。storage は getItem/setItem を持つもの
  load(st) {
    let raw = null;
    try { raw = st.getItem(SAVE_KEY); } catch (_) {}
    if (raw) {
      try { return this.sanitize(JSON.parse(raw)); } catch (_) { return this.newSave(); }
    }
    const s = this.newSave();
    let v1 = 0;
    try { v1 = parseInt(st.getItem(V1_BEST_KEY), 10) || 0; } catch (_) {}
    if (v1 > 0) { s.best[0] = v1; this.persist(st, s); }
    return s;
  },
  persist(st, save) {
    try { st.setItem(SAVE_KEY, JSON.stringify(save)); return true; } catch (_) { return false; }
  },
};

  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const sw = Math.min(W, H * 9 / 16);
  U = sw / 100; OX = (W - sw) / 2; OY = (H - sw * 16 / 9) / 2;
  EX0 = -OX / U; EX1 = 100 + OX / U; EY0 = -OY / U; EY1 = 177.78 + OY / U;
  LANES = lanesFor(EX1 - EX0, LS);
}

// ---- 横画面：同じ体育館に、ならんだレーン（右左左右の 3 本線のセット）を横にも並べ、分身は奥だけでなく横にも並ぶ ----
// 縦画面（幅 100）では 1 レーン＝今までどおり。横に広いほどレーンが増える（16:9 で 5 レーン）。本人はまん中のレーン。数え方は 15-venues.js
let LANES = 1;
const SLOTS = { n: 0, list: [] };
function slotOf(k) {   // 分身 k（1 から）が立つ場所 {z 奥行き, lane レーン番号, wx レーンの中でのずれ}
  if (SLOTS.n !== LANES) { SLOTS.n = LANES; SLOTS.list = buildSlots(LANES, CL.length - 1); }
  return SLOTS.list[k - 1];
}
function crowdZ0() { return LANES === 1 ? 18 : Math.max(11, slotOf(CL.length - 1).z + 2.5); }

// 床の遠近。z は奥行き（0 が本人）
const YH = 62, Y0 = 140, LS = 26, KS = 1.12;
const sOf = z => 1 / (1 + 0.13 * z);
const yOf = s => YH + (Y0 - YH) * s;
const xOf = (wx, s) => 50 + wx * LS * s;
const easeOut = p => 1 - (1 - p) * (1 - p);

// ---- 演出の状態 ----
const popups = [], smoke = [], hist = [];
let hudPop = 0, flash = 0, shakeT = 0, tripAt = -99, lvlShown = 0, bubbleT = 0;
let rivalPassed = false, rivalPassAt = -99;   // 測定中にライバルの記録を超えたか
let crowdAmt = 0;   // 奥の人だかりの量（0〜1）。分身が 48 人を超えると出てくる
const CL = [];   // 分身 k=1..47 の見た目の状態
for (let k = 0; k < 48; k++) CL.push({ app: 0 });

function addPopup(text, x, y, size, color, life, rise, outline) {
  popups.push({ text, x, y, size, color, life: 0, max: life, rise, outline: outline || '#fff' });
}

// ---- 小道具 ----
function rr(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function txt(s, x, y, size, fill, o) {
  o = o || {};
  cx.font = (o.weight || 'bold') + ' ' + size + 'px ' + FONT;
  cx.textAlign = o.align || 'center'; cx.textBaseline = 'middle';
  if (o.stroke) { cx.lineJoin = 'round'; cx.lineWidth = o.sw || size * 0.18; cx.strokeStyle = o.stroke; cx.strokeText(s, x, y); }
  cx.fillStyle = fill; cx.fillText(s, x, y);
}

// 本人の位置の履歴（分身は少し遅れて同じ動きをする）
function histX(tt) {
  for (let i = hist.length - 1; i >= 0; i--) if (hist[i].t <= tt) return hist[i].x;
  return hist.length ? hist[0].x : 0;
}
function pushHist() {
  hist.push({ t: nowT, x: Game.xv });
  while (hist.length > 2 && hist[1].t < nowT - 2) hist.shift();
}

// ---- 人（体操服の生徒）。x,y は足元の真ん中、s は大きさ ----
function drawKid(c, x, y, s, o) {
  o = o || {};
  const lean = o.lean || 0, hop = o.hop || 0, fall = o.fall || 0, sit = o.sit || 0, face = o.face || 0;
  c.save();
  c.globalAlpha = o.alpha == null ? 1 : o.alpha;
  c.translate(x, y); c.scale(s, s);
  c.fillStyle = 'rgba(70,45,10,.22)';
  c.beginPath(); c.ellipse(0, 0.6, 7 - hop * 2.2, 2.1, 0, 0, 6.283); c.fill();
  c.translate(0, -hop * 5.5 - (o.bob || 0));
  c.rotate(fall * 1.42 * (o.fallDir || 1));
  c.scale(1, 1 - 0.38 * sit);

  const skin = o.skin || '#f3c8a0', hair = o.hair || '#3a2a22';
  const sp = 2.4 + Math.min(1, Math.abs(lean)) * 4.6;
  // 足
  c.strokeStyle = o.legs || skin; c.lineWidth = 3; c.lineCap = 'round';
  c.beginPath(); c.moveTo(-2, -11.5); c.lineTo(-sp, -0.8); c.moveTo(2, -11.5); c.lineTo(sp, -0.8); c.stroke();
  c.fillStyle = '#fff'; c.strokeStyle = '#d33'; c.lineWidth = 0.5;
  for (const sx of [-sp, sp]) { c.beginPath(); c.ellipse(sx, -0.5, 2.7, 1.3, 0, 0, 6.283); c.fill(); c.stroke(); }
  // 短パン・体操服
  c.fillStyle = o.shorts || '#2c4aa0'; rr(c, -5.3, -15.5, 10.6, 5.6, 1.6); c.fill();
  c.fillStyle = o.shirt || '#ffffff'; c.strokeStyle = '#c9d0e4'; c.lineWidth = 0.5;
  rr(c, -5.6, -25.4, 11.2, 11.4, 3); c.fill(); c.stroke();
  c.fillStyle = o.collar || '#2c4aa0'; c.fillRect(-3.2, -25.5, 6.4, 1.1);
  c.fillStyle = '#fff'; c.strokeStyle = '#9aa7d0'; c.lineWidth = 0.35; c.fillRect(-2.6, -21.6, 5.2, 3.6); c.strokeRect(-2.6, -21.6, 5.2, 3.6);   // ゼッケン
  // 腕
  c.strokeStyle = o.arm || skin; c.lineWidth = 2.5;
  const sw = Math.min(1, 0.3 + Math.abs(lean)) * Math.sin((o.ph || 0));
  c.beginPath();
  if (o.cheer) {   // 万歳
    const b = Math.sin((o.ph || 0)) * 2;
    c.moveTo(-5.2, -23.5); c.lineTo(-8.5, -31 - b); c.moveTo(5.2, -23.5); c.lineTo(8.5, -31 + b);
  } else if (o.point) {   // 正しい側を指さす
    c.moveTo(-5.2, -23.5); c.lineTo(-8.5, -17);
    c.moveTo(5.2, -23.5); c.lineTo(5.2 + o.point * 9, -26.5);
    if (o.point < 0) { c.moveTo(-5.2, -23.5); c.lineTo(-14, -26.5); c.moveTo(5.2, -23.5); c.lineTo(8.5, -17); }
  } else {
    c.moveTo(-5.2, -23.5); c.lineTo(-8.8 - sw * 2.5, -16.5 - hop * 5 - sw * 3);
    c.moveTo(5.2, -23.5); c.lineTo(8.8 + sw * 2.5, -16.5 - hop * 5 + sw * 3);
  }
  c.stroke();
  // 頭
  const hy = -30.2;
  c.fillStyle = skin; c.beginPath(); c.arc(0, hy, 5.6, 0, 6.283); c.fill();
  c.fillStyle = hair; c.beginPath(); c.arc(0, hy - 0.4, 5.9, Math.PI * 1.0, Math.PI * 2.0); c.closePath(); c.fill();
  if (o.band !== false) { c.fillStyle = '#e03030'; c.fillRect(-5.7, hy - 2.7, 11.4, 1.7); }
  // 顔
  c.strokeStyle = '#3a2a22'; c.fillStyle = '#3a2a22'; c.lineWidth = 0.6; c.lineCap = 'round';
  if (fall > 0.35) {   // 目を回す
    for (const ex of [-2.2, 2.2]) { c.beginPath(); c.moveTo(ex - 0.9, hy - 0.2); c.lineTo(ex + 0.9, hy + 1.6); c.moveTo(ex + 0.9, hy - 0.2); c.lineTo(ex - 0.9, hy + 1.6); c.stroke(); }
    c.beginPath(); c.arc(0, hy + 3.3, 0.9, 0, 6.283); c.stroke();
  } else {
    c.beginPath(); c.arc(-2.2, hy + 0.9, 0.7, 0, 6.283); c.arc(2.2, hy + 0.9, 0.7, 0, 6.283); c.fill();
    if (face >= 3) {   // 真顔・必死
      c.beginPath(); c.moveTo(-3.6, hy - 0.3); c.lineTo(-1.1, hy + 0.2); c.moveTo(3.6, hy - 0.3); c.lineTo(1.1, hy + 0.2); c.stroke();
    }
    c.beginPath();
    if (o.cheer || face === 0) { c.arc(0, hy + 2.6, 1.5, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke(); }
    else if (face >= 5) { c.moveTo(-1.6, hy + 3.2); c.lineTo(1.6, hy + 3.2); c.stroke(); }
    else if (face >= 3) { c.moveTo(-1.5, hy + 3.2); c.lineTo(1.5, hy + 3.2); c.stroke(); }
    else { c.arc(0, hy + 3.1, 0.8, 0, 6.283); c.stroke(); }
    if (o.cheer) { c.fillStyle = '#c44'; c.beginPath(); c.arc(0, hy + 3.2, 1.2, 0, 3.1416); c.fill(); }
  }
  if (face >= 2 || fall > 0.1) {   // 汗
    c.fillStyle = '#7ad0ff'; c.beginPath(); c.moveTo(6.4, hy - 2.5); c.quadraticCurveTo(8.4, hy + 0.5, 6.4, hy + 1.2); c.quadraticCurveTo(4.5, hy + 0.5, 6.4, hy - 2.5); c.fill();
  }
  c.restore();
}

// 床のテープ線 3 本（手前へ広がる）。次に跳ぶ線をうっすら光らせる
function lineQuad(wx, w0, s0, s1) {
  cx.beginPath();
  cx.moveTo(xOf(wx, s0) - w0 * s0, yOf(s0)); cx.lineTo(xOf(wx, s0) + w0 * s0, yOf(s0));
  cx.lineTo(xOf(wx, s1) + w0 * s1, yOf(s1)); cx.lineTo(xOf(wx, s1) - w0 * s1, yOf(s1));
  cx.closePath();
}
function drawLines() {
  const sMax = (EY1 - YH) / (Y0 - YH) + 0.05;
  const glow = (Game.mode === 'play' && Game.stun <= 0) ? Game.nextLines() : [];
  const pulse = 0.5 + 0.5 * Math.sin(nowT * 9);
  const title = App.screen === 'title';
  for (const lane of laneOrder(LANES)) {
    // 本人のレーンはいつも。となりのレーンは、そこに分身が出てきたぶんだけ現れる
    let amt = lane === 0 ? 1 : 0;
    if (lane !== 0) for (let k = 1; k < CL.length; k++) if (slotOf(k).lane === lane && CL[k].app > amt) amt = CL[k].app;
    if (amt <= 0.01 || title) continue;
    cx.save(); cx.globalAlpha = Math.min(1, amt * 1.5) * (lane === 0 ? 1 : 0.8);
    for (let i = 0; i < 3; i++) {
      const wx = lane * LANE_W + i - 1, on = lane === 0 && glow.indexOf(i) >= 0;
      if (on) {
        cx.fillStyle = 'rgba(255,240,90,' + (0.22 + 0.2 * pulse) + ')';
        lineQuad(wx, 4.2, 0.02, sMax); cx.fill();
        cx.fillStyle = 'rgba(255,255,170,' + (0.25 + 0.25 * pulse) + ')';
        lineQuad(wx, 2.4, 0.02, sMax); cx.fill();
      }
      cx.fillStyle = on ? '#fffbe0' : '#fbfbf5';
      lineQuad(wx, 0.85, 0.02, sMax); cx.fill();
      cx.fillStyle = 'rgba(0,0,0,.08)';
      lineQuad(wx, 0.3, 0.02, sMax); cx.fill();
    }
    cx.restore();
  }
}

// ---- タイトルの絵：記録板なし。体育館のまえに、体操服の分身がずらりと並んで、波のように反復横とびをしている ----
function drawTitleScene() {
  const t = nowT, wide = EX1 - EX0, mid = (EX0 + EX1) / 2;
  const g = cx.createLinearGradient(0, EY0, 0, 72);   // 上は少し暗くして、ロゴを読みやすく
  g.addColorStop(0, 'rgba(14,24,66,.62)'); g.addColorStop(1, 'rgba(14,24,66,0)');
  cx.fillStyle = g; cx.fillRect(EX0 - 5, EY0 - 5, wide + 10, 72 - EY0 + 5);
  const rows = [[6, 1.3, 0.2], [3, 0.7, 0.5], [0, 0, 0]];   // [奥行き z, 波のずれ, 列のずらし]
  rows.forEach(([z, ph0, off], ri) => {
    const s = sOf(z), y = z === 0 ? Y0 : yOf(s), gap = 19 * s + 1;
    let n = Math.min(15, Math.floor((wide - 14) / gap) + 1); if (n % 2 === 0) n--;
    for (let i = 0; i < n; i++) {
      const ph = t * 2.3 - i * 0.55 + ph0, x = mid + (i - (n - 1) / 2) * gap + off * gap + Math.sin(ph) * 5 * s;
      if (x < EX0 - 12 || x > EX1 + 12) continue;
      const c = Math.cos(ph);
      drawKid(cx, x, y, s * KS, { lean: clamp(c * 0.8, -1, 1), hop: Math.abs(c) * 0.5, ph: t * 9 + i * 1.7, face: 0, alpha: 0.78 + 0.22 * s });
    }
  });
}

// ---- 本人と分身 ----
function fallAmt(delay, isPlayer) {
  if (isPlayer) {
    if (Game.stun <= 0) return 0;
    const el = CFG.stunSecs - Game.stun;
    return clamp(el / 0.07, 0, 1) * clamp(Game.stun / 0.1, 0, 1);
  }
  const tt = nowT - tripAt - delay;
  if (tt < 0 || tt > 0.12 + 0.22 + 0.2) return 0;
  return clamp(tt / 0.12, 0, 1) * clamp((0.12 + 0.22 + 0.2 - tt) / 0.2, 0, 1);
}

function bodyOpts(tt, k, isPlayer, finishing) {
  const x = histX(tt), xp = histX(tt - 0.05);
  const sp = (x - xp) / 0.05;
  return { x, lean: clamp(sp / 14, -1, 1), hop: finishing ? 0 : clamp(Math.abs(sp) / 22, 0, 1) * (curVenue().lowG ? 1.7 : 1) };   // 月面は弧がふわっと高い（見た目だけ）
}

function drawBodies() {
  const lv = Game.lvl, N = CFG.bodies[lv];
  const finishing = Game.mode === 'finish' || Game.mode === 'over';
  const sit = finishing ? clamp(Game.finT / 0.35 + (Game.mode === 'over' ? 1 : 0), 0, 1) : 0;
  const breath = finishing ? Math.sin(nowT * 9) * 0.5 : 0;
  const face = finishing ? 4 : Math.min(lv + 1, 6) * (Game.mode === 'play' ? 1 : 0);
  const ph = nowT * 14;
  // 分身（奥から手前へ）
  const list = [];
  for (let k = 1; k < CL.length; k++) if (CL[k].app > 0.01) list.push(k);
  list.sort((a, b) => slotOf(b).z - slotOf(a).z || b - a);   // 奥（z が大きい）から
  const px = xOf(Game.xv, 1);
  for (const k of list) {
    const sl = slotOf(k), z = sl.z;
    const s = sOf(z), a = CL[k].app, ea = easeOut(Math.min(1, a));
    const d = k * CFG.cloneDelay;
    const o = bodyOpts(nowT - d, k, false, finishing);
    const slotX = xOf(o.x + sl.wx + sl.lane * LANE_W, s), slotY = yOf(s);
    const x = px + (slotX - px) * ea, y = Y0 + (slotY - Y0) * ea;
    const fa = fallAmt(z * 0.02, false);
    drawKid(cx, x, y, s * KS * (0.7 + 0.3 * ea), {
      lean: o.lean, hop: o.hop, ph: ph + k, fall: fa, fallDir: k % 2 ? 1 : -1, sit, bob: breath,
      alpha: Math.min(1, a * 1.4) * (0.9 - Math.min(0.25, z * 0.02)), face: finishing ? 4 : face,
    });
  }
  // 本人の残像（段階1から）
  const o = bodyOpts(nowT, 0, true, finishing);
  const px2 = xOf(o.x, 1);
  if (lv >= 1 && Game.mode === 'play') {
    const gn = lv >= 2 ? 3 : 2;
    for (let i = gn; i >= 1; i--) {
      const gx = xOf(histX(nowT - i * 0.035), 1);
      if (Math.abs(gx - px2) < 0.8) continue;
      drawKid(cx, gx, Y0, KS, { lean: o.lean, hop: o.hop, ph, alpha: 0.2 * (gn - i + 1) / gn, face });
    }
  }
  const pf = fallAmt(0, true);
  let point = 0;
  if (pf > 0.2) { const w = Game.nextSides(); if (w.length === 1) point = w[0]; }
  drawKid(cx, px2, Y0, KS, { lean: o.lean, hop: o.hop, ph, fall: pf, fallDir: -Game.lastSide || 1, sit, bob: breath, face, point });
}

// ---- 人だかり：分身が 48 人を超えたら、手前の 47 人はそのまま描き、奥へ小さな人の列を足す（描く数に上限）----
function crowdTarget() {
  const lv = Game.mode === 'play' ? Game.lvl : (Game.mode === 'finish' || Game.mode === 'over' ? lvlShown : 0);
  const N = CFG.bodies[lv] || 1;
  return N > 48 ? clamp(Math.log(N / 48) / Math.log(20000 / 48), 0.05, 1) : 0;
}
function drawCrowd() {
  if (crowdAmt < 0.01) return;
  const rows = 4 + Math.round(crowdAmt * 9), maxPer = 22 + Math.round(crowdAmt * 16), fill = 0.4 + 0.6 * crowdAmt;
  const wide = EX1 - EX0 + 24;
  cx.save(); cx.globalAlpha = 0.9 * Math.min(1, crowdAmt * 8);
  for (let r = rows - 1; r >= 0; r--) {   // 奥の列から
    const z = crowdZ0() + r * 3.2, s = sOf(z), y = yOf(s), sc = s * KS * 1.25;
    const step = Math.max(8 * sc, wide / maxPer), n = Math.floor(wide / step);
    const shift = histX(nowT - (48 + r * 6) * CFG.cloneDelay) * LS * s;   // 本人の動きに少し遅れてついていく
    const x0 = EX0 - 12 + (r % 2 ? step * 0.5 : 0) + shift;
    const dots = [];
    for (let i = 0; i < n; i++) {
      if (((i * 37 + r * 91) % 100) / 100 > fill) continue;
      dots.push(x0 + i * step, y - Math.abs(Math.sin(nowT * 9 + i * 1.3 + r)) * 2.2 * sc);
    }
    const part = (col, f) => { cx.fillStyle = col; cx.beginPath(); for (let k = 0; k < dots.length; k += 2) f(dots[k], dots[k + 1]); cx.fill(); };
    part('#f3c8a0', (x, yy) => { cx.rect(x - 3.6 * sc, yy - 10 * sc, 2.4 * sc, 10 * sc); cx.rect(x + 1.2 * sc, yy - 10 * sc, 2.4 * sc, 10 * sc); });
    part('#2c4aa0', (x, yy) => cx.rect(x - 5.3 * sc, yy - 15.5 * sc, 10.6 * sc, 5.6 * sc));

// 文字が枠に入りきらないときは、その幅に縮める

function drawPopups() {

// 毎フレームの見た目の更新
function updateVisual(dt) {
  pushHist();
  const N = CFG.bodies[Game.lvl];
  crowdAmt += (crowdTarget() - crowdAmt) * Math.min(1, dt * 3);
  if (crowdAmt < 0.005) crowdAmt = 0;
  for (let k = 1; k < CL.length; k++) {
    const c = CL[k];
    if (k < N) c.app = Math.min(1, c.app + dt * 4.5);
    else {
      // 転んだときは、倒れてから消える（手前から順に）。ゆっくり減速したときは、そのままふっと消える
      const z = slotOf(k).z || 1;
      const falling = nowT - tripAt < 0.12 + z * 0.02 + 0.1;
      if (!falling) c.app = Math.max(0, c.app - dt * 3.2);
    }
  }
  const lv = Game.mode === 'play' ? Game.lvl : (Game.mode === 'finish' || Game.mode === 'over' ? lvlShown : 0);
  for (const p of SP) p.app = clamp(p.app + (lv >= p.min ? dt * 2.2 : -dt * 3), 0, 1.2);
  for (let i = popups.length - 1; i >= 0; i--) { popups[i].life += dt; if (popups[i].life >= popups[i].max) popups.splice(i, 1); }
  for (let i = smoke.length - 1; i >= 0; i--) {
    const p = smoke[i]; p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.life >= p.max) smoke.splice(i, 1);
  }
  hudPop = Math.max(0, hudPop - dt * 6); flash = Math.max(0, flash - dt * 2.2); shakeT = Math.max(0, shakeT - dt);
}
function puffSmoke(n) {
  const px = xOf(Game.xv, 1);
  for (let i = 0; i < n; i++) {
    const g = curVenue().lowG ? 0.45 : 1;   // 月面：ほこりがゆっくり舞って、長く残る
    smoke.push({ x: px + (Math.random() - 0.5) * 16, y: Y0 - 1 - Math.random() * 3, vx: (Math.random() - 0.5) * 6 * g, vy: (-6 - Math.random() * 9) * g, r: 1.6 + Math.random() * 1.6, life: 0, max: (0.6 + Math.random() * 0.4) / g });
  }
}
// ===== 会場の背景・小物・記録係の顔（会場の表 VENUES を見て描き分ける）=====

const VCache = { cv: null, key: '' };
function venueLayer(V) {
  const key = (V.ck || V.i) + '|' + W + 'x' + H + '|' + DPR;
  if (VCache.key === key) return VCache.cv;

// ---- 共通の道具 ----
const SKIN = ['#f3c8a0', '#e8b890', '#d9a578', '#c18a62', '#f6d4b4'];
const HAIR = ['#2a1c16', '#3a2a22', '#5a3a22', '#1a1a1e', '#777', '#8a6a3a'];

function glow(x, y, r, rgb, a) {
  const g = cx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, 'rgba(' + rgb + ',' + a + ')'); g.addColorStop(1, 'rgba(' + rgb + ',0)');
  cx.fillStyle = g; cx.fillRect(x - r, y - r, r * 2, r * 2);
}
// 観客席の人（頭と肩）。rows＝[{y（肩の下の高さ）, size, gap}]、奥の列から順に描く
function standCrowd(rows, xa, xb, pal, seed, o) {
  o = o || {};
  const R = mulberry32(seed);
  for (const r of rows) {
    const sc = r.size;
    for (let x = xa + R() * r.gap; x < xb; x += r.gap) {
      const col = pal[(R() * pal.length) | 0], sk = SKIN[(R() * SKIN.length) | 0], hr = HAIR[(R() * HAIR.length) | 0];
      const hy = r.y - 4.6 * sc, up = o.stick && R() < o.stick;
      if (up) {   // 光る棒（ペンライト）
        const c = ['#ff3fa0', '#3fe0ff', '#ffe03f', '#7aff6a'][(R() * 4) | 0];
        cx.strokeStyle = c; cx.lineWidth = 0.55 * sc; cx.lineCap = 'round';
        cx.beginPath(); cx.moveTo(x + 2.2 * sc, r.y - 3 * sc); cx.lineTo(x + 3.2 * sc, hy - 3.4 * sc); cx.stroke();
        glow(x + 3.2 * sc, hy - 3.4 * sc, 2.6 * sc, '255,255,255', 0.35);
      }
      cx.fillStyle = col; rr(cx, x - 2.3 * sc, r.y - 4.2 * sc, 4.6 * sc, 4.2 * sc, 1.2 * sc); cx.fill();
      cx.fillStyle = sk; cx.beginPath(); cx.arc(x, hy, 1.8 * sc, 0, 6.283); cx.fill();
      cx.fillStyle = hr; cx.beginPath(); cx.arc(x, hy - 0.25 * sc, 1.9 * sc, Math.PI, 6.283); cx.fill();
    }
  }
}
function bands(col, n) {   // 手前ほど太い横しま（芝刈りの筋・床のつや）
  cx.fillStyle = col;
  const hh = EY1 - YH + 10;
  for (let k = 0; k < n; k += 2) {
    const a = Math.pow(k / n, 1.7), b = Math.pow((k + 1) / n, 1.7);
    cx.fillRect(EX0 - 5, YH + a * hh, WIDE(), (b - a) * hh);
  }
}
function fan(col, lw, step) {   // 奥の一点へ集まる筋
  cx.strokeStyle = col; cx.lineWidth = lw; cx.beginPath();
  for (let i = -30; i <= 30; i++) { cx.moveTo(50, YH); cx.lineTo(50 + i * step, EY1 + 8); }
  cx.stroke();
}
function flagAt(x, y, w, h, d) {
  const F = [
    () => { ['#f4f4f4', '#2a4aa8', '#d0242a'].forEach((c, i) => { cx.fillStyle = c; cx.fillRect(x, y + h * i / 3, w, h / 3 + 0.05); }); },
    () => { ['#1f9a52', '#f4f4f4', '#d0242a'].forEach((c, i) => { cx.fillStyle = c; cx.fillRect(x + w * i / 3, y, w / 3 + 0.05, h); }); },
    () => { cx.fillStyle = '#f8f8f8'; cx.fillRect(x, y, w, h); cx.fillStyle = '#d0242a'; cx.beginPath(); cx.arc(x + w / 2, y + h / 2, h * 0.3, 0, 6.283); cx.fill(); },
    () => { cx.fillStyle = '#d0242a'; cx.fillRect(x, y, w, h); cx.fillStyle = '#fff'; cx.fillRect(x + w * 0.3, y, w * 0.14, h); cx.fillRect(x, y + h * 0.42, w, h * 0.16); },
    () => { for (let i = 0; i < 5; i++) { cx.fillStyle = i % 2 ? '#f4f4f4' : '#d0242a'; cx.fillRect(x, y + h * i / 5, w, h / 5 + 0.05); } cx.fillStyle = '#2a4aa8'; cx.fillRect(x, y, w * 0.45, h * 0.55); },
    () => { ['#161616', '#f2c61e', '#d0242a'].forEach((c, i) => { cx.fillStyle = c; cx.fillRect(x, y + h * i / 3, w, h / 3 + 0.05); }); },
    () => { cx.fillStyle = '#1f9a52'; cx.fillRect(x, y, w, h); cx.fillStyle = '#f2c61e'; cx.beginPath(); cx.moveTo(x + w / 2, y + h * 0.12); cx.lineTo(x + w * 0.88, y + h / 2); cx.lineTo(x + w / 2, y + h * 0.88); cx.lineTo(x + w * 0.12, y + h / 2); cx.closePath(); cx.fill(); },
    () => { cx.fillStyle = '#2a4aa8'; cx.fillRect(x, y, w, h); cx.fillStyle = '#f2c61e'; cx.beginPath(); cx.arc(x + w / 2, y + h / 2, h * 0.28, 0, 6.283); cx.fill(); },
  ];
  F[d % F.length]();
}

// ---- 静かな部分をまとめて描く ----
const LATE = { teachersRow: 1, studentsRow: 1, cameras: 1, judges: 1 };   // 床に足がつく小物は、床を描いたあとに
function paintStatic(V) {
  // 壁（空）
  const top = EY0 - 5;
  let g = cx.createLinearGradient(0, top, 0, YH);
  g.addColorStop(0, V.wall[0]); g.addColorStop(1, V.wall[1]);
  cx.fillStyle = g; cx.fillRect(EX0 - 5, top, WIDE(), YH - top + 0.5);
  BACK[V.kind](V);
  for (const n of V.props) if (!LATE[n] && PROP[n] && PROP[n].draw) PROP[n].draw(V);
  paintFloor(V);
  for (const n of V.props) if (LATE[n] && PROP[n] && PROP[n].draw) PROP[n].draw(V);
  // 床と壁の境
  cx.fillStyle = V.kind === 'space' || V.kind === 'tv' ? V.wainLine : 'rgba(0,0,0,.25)';

  cx.globalAlpha = 1;

const BACK = {

    cx.fillStyle = V.wain; cx.fillRect(EX0 - 5, 56, WIDE(), YH - 56);
    cx.fillStyle = V.wainLine; cx.fillRect(EX0 - 5, 56, WIDE(), 0.8);
  },
  arena(V) {

  },
  tv(V) {

function paintFloor(V) {
  const g = cx.createLinearGradient(0, YH, 0, EY1);

  cx.fillStyle = g; cx.fillRect(EX0 - 5, YH, WIDE(), EY1 - YH + 5);
  const R = mulberry32(V.i * 977 + 5), hh = EY1 - YH;
  switch (V.floorStyle) {
    case 'planks':
      fan('rgba(120,80,30,.16)', 0.25, 14);
      glow(50, 118, 70, '255,245,210', 0.35);
      break;
    case 'court':
      fan('rgba(255,255,255,.13)', 0.25, 14);
      glow(50, 118, 70, '255,255,255', 0.28);
      break;
    case 'turf':
      bands('rgba(0,0,0,.07)', 16);

      break;
    case 'glass':
      glow(18, 100, 60, '255,63,160', 0.28); glow(82, 120, 60, '63,224,255', 0.25);

    case 'track':

      bands('rgba(0,0,0,.05)', 14);
      glow(50, 118, 70, '255,220,200', 0.25);
      break;
    case 'regolith': {
      for (let k = 0; k < 34; k++) {   // クレーター。奥ほど小さく
        const z = Math.pow(R(), 0.8), y = YH + 2 + z * (hh - 2), s = 0.15 + z * 0.85, x = EX0 + R() * (EX1 - EX0), rw = (3 + R() * 7) * s * 2.2;
        cx.fillStyle = 'rgba(30,30,40,.20)'; cx.beginPath(); cx.ellipse(x, y, rw, rw * 0.28, 0, 0, 6.283); cx.fill();
        cx.strokeStyle = 'rgba(230,230,240,.22)'; cx.lineWidth = 0.35 * s + 0.1;
        cx.beginPath(); cx.ellipse(x, y - rw * 0.04, rw, rw * 0.28, 0, 0.1 * Math.PI, 0.9 * Math.PI); cx.stroke();
      }
      cx.fillStyle = 'rgba(255,255,255,.10)';
      for (let k = 0; k < 220; k++) { const z = R(); cx.fillRect(EX0 + R() * (EX1 - EX0), YH + 1 + z * (hh - 1), 0.25 + z * 0.35, 0.18 + z * 0.2); }
      glow(50, 118, 80, '255,255,255', 0.12);
      break;
    }
    case 'grid': {
      cx.strokeStyle = 'rgba(92,240,255,.20)'; cx.lineWidth = 0.28;
      cx.beginPath();
      for (let k = 1; k < 16; k++) { const y = YH + hh * Math.pow(k / 15, 2) + 4; cx.moveTo(EX0 - 5, y); cx.lineTo(EX1 + 5, y); }

      fan('rgba(92,240,255,.17)', 0.28, 16);
      glow(50, 100, 90, '120,80,255', 0.20);
      break;
    }
  }
}

const recGlass = (x, y, lv, col) => {   // 眼鏡と目（段階 2 でまん丸、4 でふるえる）
  const ey = y + 1.0, big = lv >= 2 ? 2.35 : 1.8, wob = lv >= 4 ? Math.sin(nowT * 40) * 0.25 : 0;
  cx.strokeStyle = col || '#2b2b3a'; cx.lineWidth = 0.6; cx.fillStyle = '#fff';
  cx.beginPath(); cx.arc(x - 2.6, ey, big, 0, 6.283); cx.moveTo(x + 2.6 + big, ey); cx.arc(x + 2.6, ey, big, 0, 6.283); cx.moveTo(x - 0.8, ey); cx.lineTo(x + 0.8, ey);
  cx.fill(); cx.stroke();
  cx.fillStyle = '#2b2b3a';
  cx.beginPath(); cx.arc(x - 2.6 + wob, ey, lv >= 2 ? 0.5 : 0.8, 0, 6.283); cx.arc(x + 2.6 + wob, ey, lv >= 2 ? 0.5 : 0.8, 0, 6.283); cx.fill();
};
const recDots = (x, y, lv, brow) => {   // 眼鏡なしの目（まゆ毛つき）
  const wob = lv >= 4 ? Math.sin(nowT * 40) * 0.25 : 0, ey = y + 1.0, rr_ = lv >= 2 ? 1.15 : 0.85;
  cx.fillStyle = '#2b2b3a'; cx.beginPath(); cx.arc(x - 2.6 + wob, ey, rr_, 0, 6.283); cx.arc(x + 2.6 + wob, ey, rr_, 0, 6.283); cx.fill();
  cx.strokeStyle = '#2b2b3a'; cx.lineWidth = 0.6; cx.lineCap = 'round'; cx.beginPath();
  const up = lv >= 2 ? -1.6 : 0, tilt = brow ? 0.9 : 0;
  cx.moveTo(x - 4.2, ey - 2.2 + up + tilt); cx.lineTo(x - 1.2, ey - 2.4 + up - tilt); cx.moveTo(x + 4.2, ey - 2.2 + up + tilt); cx.lineTo(x + 1.2, ey - 2.4 + up - tilt); cx.stroke();
};
const recMouth = (x, y, lv, fin) => {
  cx.strokeStyle = '#2b2b3a'; cx.lineWidth = 0.6; cx.beginPath();
  if (lv >= 5) { cx.fillStyle = '#7a2a2a'; cx.ellipse(x, y + 5.3, 1.6, 2.1, 0, 0, 6.283); cx.fill(); }
  else if (lv >= 2) { cx.arc(x, y + 5, 1.1, 0, 6.283); cx.stroke(); }
  else if (fin) { cx.moveTo(x - 1.4, y + 5); cx.lineTo(x + 1.4, y + 5); cx.stroke(); }
  else { cx.arc(x, y + 3.9, 1.5, 0.2 * Math.PI, 0.8 * Math.PI); cx.stroke(); }
};
const recSweat = (x, y, r, lv) => {
  if (lv < 3) return;
  cx.fillStyle = '#7ad0ff'; cx.beginPath(); cx.moveTo(x + r - 0.4, y - 2); cx.quadraticCurveTo(x + r + 1.8, y + 1.5, x + r - 0.4, y + 2.3); cx.quadraticCurveTo(x + r - 2.4, y + 1.5, x + r - 0.4, y - 2); cx.fill();
};
const recWhistle = (x, y) => { cx.fillStyle = '#e8c030'; cx.beginPath(); cx.arc(x - 3, y + 8.2, 1, 0, 6.283); cx.fill(); };
const recBinder = (x, y, lv) => {   // バインダー、段階 5 からは電卓

    cx.fillStyle = '#4a4f5c'; rr(cx, x + 1, y + 8, 7.5, 7.5, 0.8); cx.fill();

// ===== エンディング（宇宙大会に初めて勝ったあと。約 16 秒・タップでとばせる）=====
// 流れ：①分身が整列して銀河へ ②宇宙人の記録係が宇宙記録の記録用紙に書きこむ ③そのころ、体育館で担任の先生が落ち着いて読み上げる
//       →「そうはならんやろ」→ 記録用紙（宇宙記録）→ 大会の一覧へ。v1 の「途中まで普通なのに、最後に そうはならんやろ」と同じ味
const End = { on: false, t: 0, cert: false, rec: 0, f: {}, stars: null, flashAt: -9 };

// 「|」の切れ目だけで改行する文字の並べ（途中で言葉を割らない）
function chunkLines(s, size, maxW) {
  cx.font = 'bold ' + size + 'px ' + FONT;
  const lines = []; let cur = '';
  for (const p of s.split('|')) {
    if (cur && cx.measureText(cur + STRSEP + p).width > maxW) { lines.push(cur); cur = p; } else cur += (cur ? STRSEP : '') + p;
  }
  lines.push(cur);
  return lines;
}
function drawChunks(s, x, y, size, maxW, fill, o) {
  const ls = chunkLines(s, size, maxW), lh = size * 1.32;
  ls.forEach((l, i) => txt(l, x, y + (i - (ls.length - 1) / 2) * lh, size, fill, o));
}

function startEnding(rec) {
  resetRun();
  End.on = true; End.t = 0; End.cert = false; End.rec = rec; End.f = {}; End.flashAt = -9;
  $('ending').classList.remove('cert');
  $('cStamp').classList.remove('on');
  Snd.setVenue(8); Snd.endSweep();
}
function skipEnding() { if (End.on && !End.cert && End.t > 0.25) End.t = endingTotal(); }
function endingPhase() {
  const T = ENDING_TIMES;
  if (End.t < T.galaxy) return 'galaxy';
  if (End.t < T.galaxy + T.sheet) return 'sheet';
  if (End.t < endingTotal()) return 'teacher';
  return 'cert';
}
function once(key, cond, fn) { if (cond && !End.f[key]) { End.f[key] = 1; fn(); } }

function updateEnding(dt) {
  if (!End.on) return;
  End.t += dt;
  const T = ENDING_TIMES, s0 = T.galaxy, s1 = T.galaxy + T.sheet, t = End.t;
  once('b1', t > 1.8, () => Snd.blip(3));
  once('b2', t > 3.6, () => Snd.blip(5));
  once('r1', t > s0 + 0.7, () => Snd.endType());
  once('r2', t > s0 + 1.3, () => Snd.endType());
  if (t > s0 + 1.3 && t < s0 + 3.0) { End.f.tk = (End.f.tk || 0) + dt; if (End.f.tk > 0.11) { End.f.tk = 0; Snd.endType(); } }
  once('st', t > s0 + 3.3, () => { Snd.stamp(); Snd.blip(2); });
  once('t1', t > s1 + 0.5, () => Snd.endType());
  once('t2', t > s1 + 2.3, () => Snd.endType());
  once('t3', t > s1 + 4.0, () => Snd.endType());
  once('so', t > s1 + 4.4, () => { Snd.sonna(); End.flashAt = nowT; });
  if (!End.cert && t >= endingTotal()) {
    End.cert = true; End.flashAt = nowT;
    $('cRec').textContent = fmt(End.rec); fitRec($('cRec'));
    $('ending').classList.add('cert');
    Tourney.markEndingSeen(SAVE); Tourney.persist(store, SAVE);   // 最後まで見た（途中でページを閉じたら、次に大会の一覧を開いたときもう一度出る）
    focusMain();
    Snd.endJingle();
    setTimeout(() => { $('cStamp').classList.add('on'); Snd.stamp(); }, 700);
  }
}

function endStars() {

function spaceBg() {

}
const eIO = q => q < 0.5 ? 2 * q * q : 1 - Math.pow(-2 * q + 2, 2) / 2;
function endCaption(s, y, a) {

// ① 分身が整列して、銀河へ散らばっていく
function sceneGalaxy(t, caps) {
  const wide = EX1 - EX0, C = wide > 110 ? clamp(Math.round((wide - 16) / 7.1), 12, 26) : 12, N = C * 7;   // 横画面は列を増やして横いっぱいに
  const step = wide > 110 ? (wide - 16) / (C - 1) : 7.1, fx0 = wide > 110 ? EX0 + 8 : 12, radMax = Math.max(86, wide * 0.5);
  const q = eIO(clamp((t - 1.8) / 1.6, 0, 1)), ex = Math.max(0, t - 3.6);
  for (let i = 0; i < N; i++) {
    const col = i % C, row = (i / C) | 0;
    const fx = fx0 + col * step + Math.sin(t * 9 + (row % 2) * 3.14) * 1.8 * (1 - q), fy = 82 + row * 11;
    const ang = i * 0.42 + t * 0.5, rad = (6 + i / N * (radMax - 6)) * (1 + ex * 0.35);
    const sx = 50 + Math.cos(ang) * rad, sy = 112 + Math.sin(ang) * rad * 0.55;
    const x = fx + (sx - fx) * q, y = fy + (sy - fy) * q;
    const a = clamp((t - i * 0.012) / 0.3, 0, 1) * (1 - 0.45 * clamp(ex / 1.6, 0, 1));
    if (a <= 0.01 || x < EX0 - 12 || x > EX1 + 12) continue;
    const sc = (0.3 - 0.1 * q) * (1 - Math.min(0.4, ex * 0.12));
    drawKid(cx, x, y, sc, { hop: (1 - q) * (0.5 + 0.5 * Math.sin(t * 9 + i)), lean: (1 - q) * Math.cos(t * 9 + (row % 2) * 3.14), ph: t * 14 + i, alpha: a, face: 0 });
  }
  if (caps) {
    const T = ENDING_TIMES.galaxy;
    if (t > 0.3 && t < 2.7) endCaption(STR.ending.cap.galaxy[0], 160, Math.min((t - 0.3) / 0.4, (2.7 - t) / 0.4));
    if (t > 2.9 && t < T) endCaption(STR.ending.cap.galaxy[1], 160, Math.min((t - 2.9) / 0.4, (T - t) / 0.3));
  }
}

// 記録用紙（宇宙記録）のうしろ：ゆっくり回る銀河と分身
function sceneCert() { sceneGalaxy(4.2 + (End.t - endingTotal()) * 0.25, false); }

function drawEndingScene() {
  const ph = endingPhase(), T = ENDING_TIMES, t = End.t;
  spaceBg();
  if (ph === 'galaxy') sceneGalaxy(t, true);
  else if (ph === 'sheet') sceneSheet(t - T.galaxy);
  else if (ph === 'teacher') sceneTeacher(t - T.galaxy - T.sheet);
  else sceneCert();
  // 場面のつなぎ目は、いったん暗くして入る
  for (const b of [T.galaxy, T.galaxy + T.sheet]) {
    const d = t - b;
    if (d > -0.2 && d < 0.35) { cx.fillStyle = 'rgba(0,0,0,' + (d < 0 ? (d + 0.2) / 0.2 : 1 - d / 0.35) + ')'; cx.fillRect(EX0 - 5, EY0 - 5, EX1 - EX0 + 10, EY1 - EY0 + 10); }

// ===== 画面の流れ・操作・ループ・結果・共有 =====

// 保存（localStorage が使えないとき＝data: URL やプライベートモードでも止まらない）

// 画面：title → list（大会の一覧）→ intro（ライバルの紹介）→ play（測定）→ result（記録用紙）→ list …。ending は宇宙大会に初めて勝ったあと
const App = { screen: 'title', idx: 0, introAt: 0, res: null, pendingEnding: false, shopFrom: 'list' };

let shownResult = false, rollT = 1, stampDone = true, vsT = -1, last = 0, murLvl = -1;

// 文字を画面に入れる（data-s＝そのまま、data-p＝「|」で文節に分ける）
function strAt(path) { return path.split('.').reduce((o, k) => o[k], STR); }
function applyStrings() {

// 横画面か（CSS の @media と同じ条件）
const landQ = window.matchMedia ? window.matchMedia('(min-aspect-ratio: 5/4)') : null;

// いま見えている画面の、まず選ばれるボタン（キーボードの Enter / Space で押せる）
function focusMain() {
  const s = App.screen;
  let el = null;
  if (s === 'list') el = $('listBody').querySelector('.tn.next') || $('listBody').querySelector('.tn:not(.locked)');
  else if (s === 'shop') el = $('shopBody').querySelector('.it.ok .buy') || ($('shopGo').style.display === 'none' ? $('shopBack') : $('shopGo'));
  else if (s === 'result') el = $('retry');
  else if (s === 'ending' && End.cert) el = $('endBtn');
  if (el) { try { el.focus({ preventScroll: true }); } catch (_) {} }
  else if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
