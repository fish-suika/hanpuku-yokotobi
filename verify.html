const STRS = { ja: STR_JA, en: STR_EN };
const STR = STRS[LANG];

// 「|」を、日本語では何もなし・英語では空白にした普通の文字列
const STRSEP = EN ? ' ' : '';
const phL = (s, lang) => s.replace(/\|/g, lang === 'en' ? ' ' : '');
const ph = s => s.replace(/\|/g, STRSEP);

// ===== 大きな数字の表示（ここ 1 か所）=====
// 日本語：1 万未満はカンマ、1 万以上は 万・億・兆。英語：1 万（10,000）未満はカンマ、以上は K / M / B。
// どちらも有効数字 4 桁まで・最大 6 文字（例 12.34万・123.4万・1234万・1.5億／12.35K・123.5K・1.235M）。lang を省くと今の言語
function fmtNum(v, lang) {
  let n = Math.round(Number(v));
  if (!Number.isFinite(n)) return '0';
  const neg = n < 0; if (neg) n = -n;
  const N = STRS[lang === 'ja' || lang === 'en' ? lang : LANG].num, U = N.units;   // map(fmtNum) のように添字が渡っても無視
  let out;
  if (n < N.from) {
    out = String(n).replace(/\B(?=(\d{3})+(?!\d))/g, N.sep);
  } else {
    let u = 0;
    while (u + 1 < U.length && n >= U[u + 1][0]) u++;
    const body = k => {   // 有効数字 sig 桁に丸めて、余分な 0 を落とす
      const m = n / U[k][0], d = Math.max(0, N.sig - 1 - Math.floor(Math.log10(m)));
      return Number(m.toFixed(d));
    };
    let m = body(u);
    if (u + 1 < U.length && m >= U[u + 1][0] / U[u][0]) { u++; m = body(u); }   // 9999.6万 → 1億、999.96K → 1M のような繰り上がり
    out = String(m) + U[u][1];
  }
  return neg ? '-' + out : out;
}

// ===== 横画面：レーンと分身の立つ場所（画面を使わない。描くのは 40-render.js）=====
// レーン＝右左左右の 3 本線のひとまとまり。縦画面は 1 つ、横に広いほど増える（本人はまん中）。LANE_W は床の線 1 間隔を 1 としたレーンの間隔
const LANE_W = 2.6;
// wide＝画面の幅（遊ぶ場所の幅 100 を単位に）、step＝床の線 1 間隔（40-render の LS）。レーンの数は 1・3・5・7
function lanesFor(wide, step) {
  const m = Math.floor((wide / 2 - 8) / (LANE_W * step));
  return (m >= 0 ? Math.min(3, m) : 0) * 2 + 1;
}
// 本人のレーンが先頭、そのあと左右へ 1 つずつ（0, -1, 1, -2, 2 …）
function laneOrder(n) { const o = [0]; for (let j = 1; o.length < n; j++) o.push(-j, j); return o.slice(0, n); }
// 分身 count 人の立つ場所。1 レーンは今までどおり（奥へ 3 人ずつ）。複数レーンは、1 行目が本人の横（本人のレーンはあけておく）・2 行目から全レーンで、ずらして立つ
function buildSlots(lanes, count) {
  const out = [], L = laneOrder(lanes);
  for (let i = 0; out.length < count; i++) {
    if (lanes === 1) { out.push({ z: 1 + Math.floor(i / 3), lane: 0, wx: (i % 3 - 1) * 0.3 }); continue; }
    const first = L.length - 1;
    if (i < first) { out.push({ z: 0, lane: L[i + 1], wx: 0 }); continue; }

// ===== ゲームのロジック（画面を使わない）=====
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

// 位置: 0=左の線 1=中央 2=右の線。side: -1=左をタップ 1=右をタップ
const Game = {
  mode: 'title',   // title → ready → play → finish → over
  t: 0, readyT: 0, finT: 0, seed: 1, rand: null,
  pos: 1, lastSide: 0, xv: 0, stun: 0,
  stepTimes: [], rate: 0, lvl: 0, upT: 0, downT: 0,
  rec: 0, recF: 0, steps: 0, trips: 0, maxN: 1, maxLvl: 0,
  events: [],

  reset(seed) {
    this.seed = seed == null ? (Date.now() & 0xffff) : seed;
    this.rand = mulberry32(this.seed);
    this.mode = 'title';
    this.t = 0; this.readyT = 0; this.finT = 0;
    this.pos = 1; this.lastSide = 0; this.xv = 0; this.stun = 0;
    this.stepTimes = []; this.rate = 0; this.lvl = 0; this.upT = 0; this.downT = 0;
    this.rec = 0; this.recF = 0; this.steps = 0; this.trips = 0; this.maxN = 1; this.maxLvl = 0;
    this.events = [];
  },

  begin() {
    if (this.mode !== 'title') return;
    this.mode = 'ready'; this.readyT = 0;
    this.events.push({ type: 'ready' });
  },

  bodies() { return CFG.bodies[this.lvl]; },

  // 次にタップしてよい側（-1/1）の一覧
  nextSides() {
    if (this.pos === 1) return this.lastSide === 0 ? [-1, 1] : [-this.lastSide];
    return [this.pos === 0 ? 1 : -1];
  },
  // 次に光らせる線（0/1/2）の一覧
  nextLines() {
    if (this.pos === 1) return this.nextSides().map(s => 1 + s);
    return [1];
  },

  // 左右のタップ。'step' 正しく跳んだ / 'trip' 転んだ / 'stun' 転んで動けない間 / 'ignored'
  input(side) {
    if (this.mode !== 'play') return 'ignored';
    if (this.stun > 0) return 'stun';
    let ok;
    if (this.pos === 1) ok = this.lastSide === 0 || side !== this.lastSide;   // 中央から、さっき行った側へまた跳ぶと転ぶ
    else ok = side === (this.pos === 0 ? 1 : -1);                             // 外の線から外へ跳ぶとはみ出して転ぶ
    if (ok) {
      if (this.pos === 1) { this.pos = 1 + side; this.lastSide = side; }
      else this.pos = 1;
      const n = this.bodies();
      this.steps++;
      this.recF += n * CFG.recMul;   // 記録の倍率（購買部）。小数のぶんは持ち越す
      const gain = Math.floor(this.recF + 1e-9) - this.rec;
      this.rec += gain;
      this.stepTimes.push(this.t);
      this.events.push({ type: 'step', n, gain, side, pos: this.pos });
      return 'step';
    }
    const was = this.lvl;
    this.trips++;
    this.stun = CFG.stunSecs;
    this.stepTimes.length = 0; this.rate = 0;
    this.lvl = Math.max(0, this.lvl - CFG.stunDrop);
    this.upT = 0; this.downT = 0;
    const wrongPos = this.pos;
    this.pos = 1;   // 転んだあとは中央から（lastSide は残すので、次は反対側へ行けばリズムがつながる）
    this.events.push({ type: 'trip', was, lvl: this.lvl, from: wrongPos, side, want: this.nextSides() });
    return 'trip';
  },

  candidate(rate) {
    let c = 0;
    for (let i = 0; i < CFG.levelRate.length; i++) if (rate >= CFG.levelRate[i]) c = i;
    return c;
  },

  step(dt) {
    this.xv += ((this.pos - 1) - this.xv) * (1 - Math.exp(-dt * CFG.hopK));
    if (this.mode === 'ready') {
      this.readyT += dt;
      if (this.readyT >= CFG.readySecs) {
        this.mode = 'play'; this.t = 0; this.events.push({ type: 'start' });
        if (CFG.startLvl > 0) {   // 応援団：はじめから高い段階
          this.lvl = Math.min(CFG.startLvl, CFG.levelRate.length - 1);
          this.maxLvl = this.lvl; this.maxN = Math.max(this.maxN, this.bodies());
          this.events.push({ type: 'lvl', up: true, lvl: this.lvl });
        }
      }
      return;
    }
    if (this.mode === 'finish') {
      this.finT += dt;
      if (this.finT >= CFG.finishSecs) { this.mode = 'over'; this.events.push({ type: 'over' }); }
      return;
    }
    if (this.mode !== 'play') return;
    this.t += dt;
    if (this.stun > 0) this.stun = Math.max(0, this.stun - dt);

    // 勢い：直近の歩を重みつきで数える（新しいほど重い）
    let sum = 0;
    const st = this.stepTimes;
    while (st.length && this.t - st[0] >= CFG.winEnd) st.shift();
    for (let i = 0; i < st.length; i++) {
      const age = this.t - st[i];
      sum += age <= CFG.winFull ? 1 : clamp((CFG.winEnd - age) / (CFG.winEnd - CFG.winFull), 0, 1);
    }
    this.rate = sum;

    const cand = this.candidate(this.rate);
    if (cand > this.lvl) {
      this.upT += dt; this.downT = 0;
      if (this.upT >= CFG.upHold) {
        this.lvl++; this.upT = 0;
        this.maxLvl = Math.max(this.maxLvl, this.lvl);
        this.maxN = Math.max(this.maxN, this.bodies());
        this.events.push({ type: 'lvl', up: true, lvl: this.lvl });
      }
    } else if (cand < this.lvl) {
      this.upT = 0;
      if (this.t < CFG.startGrace) this.downT = 0;   // はじめの少しのあいだは落ちない
      else if (this.stun <= 0) {
        this.downT += dt;
        if (this.downT >= CFG.downHold) {
          this.lvl--; this.downT = 0;
          this.events.push({ type: 'lvl', up: false, lvl: this.lvl });
        }
      }
    } else { this.upT = 0; this.downT = 0; }

    if (this.t >= CFG.duration) {
      this.t = CFG.duration;
      this.mode = 'finish'; this.finT = 0;
      this.events.push({ type: 'end' });
    }
  },
};

// 判定（記録から）。名前は STR.judge（言語ごと。「|」は判子の中の改行位置）。judgeFor は「|」を取った名前
function judgeIdx(rec) {

// ===== 購買部と引換券（画面を使わない）=====
// 強化の段階は保存の up（品物ごと 0〜最大）。測定のはじめに Shop.apply(save) が CFG へ掛け算・足し算で反映する。
// Shop.apply は「素の値」から計算し直すので、何度呼んでも重ならない。20-logic.js の仕組みは変えない
const SHOP_IDS = ['shoes', 'clothes', 'fall', 'recorder', 'cheer', 'book'];

const Shop = {
  ids: SHOP_IDS,
  // 強化なしの素の値（読み込み時に控えておく）
  base: {
    winFull: CFG.winFull, winEnd: CFG.winEnd, levelRate: CFG.levelRate.slice(), bodies: CFG.bodies.slice(),
    stunSecs: CFG.stunSecs, stunDrop: CFG.stunDrop,
  },

  // 素の段階の体の数に、秘伝書で増えるぶんを足した一覧（表示用）
  allBodies() { return this.base.bodies.concat(CFG.bodiesExtra); },
  zeroUp() { const u = {}; for (const id of SHOP_IDS) u[id] = 0; return u; },
  maxLevel(id) { return CFG.shop[id].price.length; },
  level(save, id) { return clamp(Math.floor(Number(save.up && save.up[id])) || 0, 0, this.maxLevel(id)); },

  // 次の段階の値段（もう最大なら null）
  price(save, id) {
    const lv = this.level(save, id);
    return lv >= this.maxLevel(id) ? null : CFG.shop[id].price[lv];
  },
  // 次の段階を買うのに勝っておく大会の数（なければ 0）。秘伝書だけ
  gate(save, id) {
    const g = CFG.shop[id].gate;
    return g ? g[this.level(save, id)] || 0 : 0;
  },
  // 'max' 最大 ／ 'locked' 大会に勝ちが足りない ／ 'poor' 引換券が足りない ／ 'ok' 買える
  state(save, id) {
    const p = this.price(save, id);
    if (p == null) return 'max';
    if (Tourney.wonCount(save) < this.gate(save, id)) return 'locked';
    return (save.tickets || 0) >= p ? 'ok' : 'poor';
  },
  canBuy(save, id) { return this.state(save, id) === 'ok'; },
  // 買う。足りない・ロック・最大なら何も変えず、理由を返す
  buy(save, id) {
    const st = this.state(save, id);
    if (st !== 'ok') return { ok: false, reason: st };
    const p = this.price(save, id);
    save.tickets -= p;
    save.up[id] = this.level(save, id) + 1;
    return { ok: true, price: p, level: save.up[id] };
  },
  // いま買える中でいちばん安い品物（なければ null）。ボット用
  cheapest(save) {
    let best = null, bp = Infinity;
    for (const id of SHOP_IDS) if (this.canBuy(save, id)) { const p = this.price(save, id); if (p < bp) { bp = p; best = id; } }
    return best;
  },

  // 段階 lv のときの効果の値（画面の「いま → 次」の表示用）
  effect(id, lv) {
    const S = CFG.shop[id], B = this.base, k = lv - 1;
    switch (id) {
      case 'shoes': return { mul: lv > 0 ? S.mul[k] : 1 };
      case 'clothes': return { mul: lv > 0 ? S.mul[k] : 1 };
      case 'fall': return { drop: lv > 0 ? S.drop[k] : B.stunDrop, secs: lv > 0 ? S.secs[k] : B.stunSecs };
      case 'recorder': return { mul: lv > 0 ? S.mul[k] : 1 };
      case 'cheer': { const sl = lv > 0 ? S.lvl[k] : 0; return { lvl: sl, bodies: this.allBodies()[sl] }; }
      case 'book': return { bodies: this.allBodies()[B.bodies.length - 1 + lv] };
    }
  },

  // 強化を CFG に反映する（測定の前に毎回）
  apply(save) {
    const B = this.base, S = CFG.shop, lv = id => this.level(save, id);
    const sh = lv('shoes') ? S.shoes.mul[lv('shoes') - 1] : 1;
    CFG.winFull = B.winFull * sh; CFG.winEnd = B.winEnd * sh;
    const cl = lv('clothes') ? S.clothes.mul[lv('clothes') - 1] : 1;
    const tiers = lv('book');
    CFG.bodies = B.bodies.concat(CFG.bodiesExtra.slice(0, tiers));
    CFG.levelRate = B.levelRate.concat(CFG.levelRateExtra.slice(0, tiers)).map((r, i) => i === 0 ? 0 : r * cl);
    const fl = lv('fall');
    CFG.stunDrop = fl ? S.fall.drop[fl - 1] : B.stunDrop;

  reset() { this.apply({ up: this.zeroUp() }); },

  payout(rec, win, target, wasWon) {
    let t = rec > 0 ? Math.max(1, Math.floor(rec * (win ? CFG.payWin : CFG.payLose))) : 0;
    if (!wasWon && target > 0) t += Math.floor(target * CFG.payPart);
    return t;
  },
};
// ===== 大会のくり返し（画面を使わない）=====
// 保存の形：{ v, unlocked（遊べる一番先の大会 0始まり）, won[大会ごとの勝ち], best[大会ごとのベスト] }
// Phase 2 で tickets（引換券の残り）と up（品物ごとの強化の段階）を、Phase 4 で endingSeen（エンディングを最後まで見たか）を足した。知らない項目は読み書きしても消さない
const SAVE_KEY = 'hanpuku-yokotobi-save';
const V1_BEST_KEY = 'hanpuku-yokotobi-best';   // v1 のベスト（引き継ぎ用に読むだけ）
const SAVE_VER = 3;   // 1＝Phase 1（大会だけ）／2＝引換券と強化／3＝endingSeen（エンディングを見たか）

const Tourney = {
  count() { return CFG.targets.length; },
  target(i) { return CFG.targets[i]; },
  // ライバルに勝つ：記録が目標を「超える」こと（同じ数は負け）。目標は使うたびに CFG から読む
  beats(rec, i) { return rec > CFG.targets[i]; },

  newSave() {
    const n = this.count();
    return { v: SAVE_VER, unlocked: 0, won: new Array(n).fill(false), best: new Array(n).fill(0), tickets: 0, up: Shop.zeroUp(), endingSeen: false };
  },

  // どんな値が来ても、使える形に直す（壊れた保存・古い保存・手で書き換えた保存）
  sanitize(o) {
    const n = this.count(), s = this.newSave();
    if (!o || typeof o !== 'object') return s;
    const out = Object.assign({}, o);   // 知らない項目は残す
    const u = Math.floor(Number(o.unlocked));
    out.unlocked = Number.isFinite(u) ? clamp(u, 0, n - 1) : 0;
    out.won = s.won.map((_, i) => Array.isArray(o.won) && o.won[i] === true);
    out.best = s.best.map((_, i) => {
      const b = Array.isArray(o.best) ? Math.floor(Number(o.best[i])) : 0;
      return Number.isFinite(b) && b > 0 ? b : 0;
    });
    // つじつま：先へ進めているなら手前は勝っている／勝った大会の次は開いている
    for (let i = 0; i < out.unlocked; i++) out.won[i] = true;
    for (let i = 0; i < n; i++) if (out.won[i]) out.unlocked = Math.max(out.unlocked, Math.min(i + 1, n - 1));
    for (let i = 0; i < out.unlocked; i++) out.won[i] = true;
    // 引換券と強化（Phase 1 の保存にはないので、なければ 0）
    const tk = Math.floor(Number(o.tickets));
    out.tickets = Number.isFinite(tk) && tk > 0 ? tk : 0;
    out.up = Shop.zeroUp();
    for (const id of Shop.ids) {
      const l = Math.floor(Number(o.up && o.up[id]));
      out.up[id] = Number.isFinite(l) ? clamp(l, 0, Shop.maxLevel(id)) : 0;
    }
    // エンディングを見たか（版 2 までの保存にはないので false。全部勝っているのに false なら、次に大会の一覧を開いたとき 1 回だけ出る）
    out.endingSeen = o.endingSeen === true;
    out.v = SAVE_VER;
    return out;
  },

  // 'won' 勝った ／ 'next' 挑戦できる（まだ勝っていない） ／ 'locked' まだ
  status(save, i) {
    if (save.won[i]) return 'won';
    return i <= save.unlocked ? 'next' : 'locked';
  },
  playable(save, i) { return i >= 0 && i < this.count() && i <= save.unlocked; },
  focusIndex(save) { return save.unlocked; },
  wonCount(save) { return save.won.filter(Boolean).length; },
  allWon(save) { return save.won.length > 0 && save.won.every(Boolean); },
  // エンディングを出すか：9 大会ぜんぶ勝っていて、まだ最後まで見ていない（ページを閉じて見損ねても、次に出る）
  shouldShowEnding(save) { return this.allWon(save) && !save.endingSeen; },
  markEndingSeen(save) { save.endingSeen = true; },

  // 1回の結果を保存の形に反映する。勝てば次の大会が開く。遊べない大会は何も変えない
  record(save, i, rec) {
    const none = { win: false, isBest: false, prevBest: save.best[i] || 0, firstWin: false, unlockedNext: false, ending: false, gain: 0 };
    if (!this.playable(save, i)) return none;
    const prevBest = save.best[i] || 0;
    const isBest = rec > prevBest;
    if (isBest) save.best[i] = rec;
    const win = this.beats(rec, i), wasWon = !!save.won[i];
    let firstWin = false, unlockedNext = false;
    if (win) {
      firstWin = !save.won[i];
      save.won[i] = true;
      if (i + 1 < this.count() && save.unlocked < i + 1) { save.unlocked = i + 1; unlockedNext = true; }
    }
    const gain = Shop.payout(rec, win, CFG.targets[i], wasWon);   // 負けても引換券はもらえる（勝つと多め）
    save.tickets = (save.tickets || 0) + gain;
    return { win, isBest, prevBest, firstWin, unlockedNext, ending: firstWin && i === this.count() - 1, gain };
  },

  // 保存の読み込み。v2 の保存がなければ v1 のベストを最初の大会のベストとして引き継ぐ。storage は getItem/setItem を持つもの
  load(st) {
    let raw = null;
    try { raw = st.getItem(SAVE_KEY); } catch (_) {}
    if (raw) {
      try { return this.sanitize(JSON.parse(raw)); } catch (_) { return this.newSave(); }
    }
    const s = this.newSave();
    let v1 = 0;
    try { v1 = parseInt(st.getItem(V1_BEST_KEY), 10) || 0; } catch (_) {}
    if (v1 > 0) { s.best[0] = v1; this.persist(st, s); }
    return s;
  },
  persist(st, save) {
    try { st.setItem(SAVE_KEY, JSON.stringify(save)); return true; } catch (_) { return false; }
  },
};
// ===== 自動テスト =====
(function () {
  const out = document.getElementById('out');
  let fail = 0;
  function check(name, cond, note) {
    if (!cond) fail++;
    const p = document.createElement('div');
    p.className = cond ? 'ok' : 'ng';
    p.textContent = (cond ? 'OK  ' : 'NG  ') + name + (note ? '  [' + note + ']' : '');
    out.appendChild(p);
  }
  const median = a => a.slice().sort((p, q) => p - q)[a.length >> 1];

  // 開始直後の遊べる状態を作る
  function startPlay(seed) {
    Game.reset(seed || 1); Game.begin();
    let n = 0;
    while (Game.mode !== 'play' && n++ < 1000) Game.step(CFG.h);
    Game.events.length = 0;
  }
  // 1 回ぶんの時間を進める
  function advance(sec) { for (let i = 0; i < Math.round(sec / CFG.h); i++) Game.step(CFG.h); }

  // ボット。rate 回/秒で押す。err 間違える確率。alt なら交互連打。
  function run(opt) {
    opt = Object.assign({ rate: 6, err: 0, alt: false, seed: 1 }, opt);
    Game.reset(opt.seed); Game.begin();
    const r = mulberry32(opt.seed * 7919 + 13);
    let next = opt.rate > 0 ? 0 : Infinity, altSide = 1, n = 0, maxLvl = 0, lvlAt = [];
    while (Game.mode !== 'over' && n++ < 120 * 40) {
      if (Game.mode === 'play' && Game.t >= next) {
        let side;
        if (opt.alt) { side = altSide; altSide = -altSide; }
        else {
          const ok = Game.nextSides();
          side = ok[0];
          if (ok.length === 1 && r() < opt.err) side = -ok[0];   // 間違い側（外へ出る／同じ側へ二度跳ぶ）
          else if (ok.length === 2) side = r() < 0.5 ? -1 : 1;
        }
        Game.input(side);
        next += 1 / opt.rate;
      }
      Game.step(CFG.h);
      maxLvl = Math.max(maxLvl, Game.lvl);
      if (Game.mode === 'play') lvlAt.push(Game.lvl);
    }
    return { rec: Game.rec, steps: Game.steps, trips: Game.trips, lvl: Game.lvl, maxLvl, maxN: Game.maxN, t: Game.t, mode: Game.mode, lvlAt };
  }

  // --- 順番の判定 ---
  startPlay();
  let allOk = true;
  for (let i = 0; i < 40; i++) {
    // 右左左右 の順を 10 回
    const seq = [1, -1, -1, 1];
    for (const s of seq) { if (Game.input(s) !== 'step') allOk = false; advance(0.02); }
  }
  check('右・左・左・右のくり返しは全部通る（転ばない）', allOk && Game.trips === 0, 'steps=' + Game.steps);

  startPlay();
  const seqL = [-1, 1, 1, -1, -1, 1, 1, -1];
  let okL = true;
  for (const s of seqL) if (Game.input(s) !== 'step') okL = false;
  check('左・右・右・左 の順でも通る（最初はどちらからでもよい）', okL && Game.trips === 0);

  startPlay();
  Game.input(1);   // 右の線へ
  check('右の線にいる', Game.pos === 2);
  const r1 = Game.input(1);   // さらに右へ＝はみ出す
  check('外の線から外へ跳ぶと転ぶ（はみ出し）', r1 === 'trip' && Game.trips === 1 && Game.pos === 1);

  startPlay();
  Game.input(1); Game.input(-1);   // 右 → 中央
  check('中央に戻った', Game.pos === 1);
  const r2 = Game.input(1);        // さっき行った右へまた跳ぶ
  check('中央から、さっき行った側へまた跳ぶと転ぶ（足がもつれる）', r2 === 'trip' && Game.trips === 1);

    const shape = (a, b, path, bad) => {
      if (typeof a !== typeof b) { bad.push(path + ' 型 ' + typeof a + '/' + typeof b); return; }
      if (Array.isArray(a)) {
        if (!Array.isArray(b) || a.length !== b.length) { bad.push(path + ' 長さ ' + a.length + '/' + (b && b.length)); return; }
        a.forEach((x, i) => shape(x, b[i], path + '[' + i + ']', bad));
      } else if (a && typeof a === 'object') {
        for (const k of Object.keys(a)) { if (!(k in b)) bad.push(path + '.' + k + ' が英語にない'); else shape(a[k], b[k], path + '.' + k, bad); }
        for (const k of Object.keys(b)) if (!(k in a)) bad.push(path + '.' + k + ' が日本語にない');
      }
    };
    const bad = []; shape(STR_JA, STR_EN, 'STR', bad);
    check('言葉の表：日本語と英語で、全部の項目がそろっている（キー・配列の長さ・関数）', bad.length === 0, bad.slice(0, 5).join(' / '));
    // 関数も同じように呼べて文字列を返す
    const calls = [];
    const callAll = (o, path) => { for (const k of Object.keys(o)) { const v = o[k]; if (typeof v === 'function') calls.push([path + '.' + k, v]); else if (v && typeof v === 'object') callAll(v, path + '.' + k); } };
    callAll(STR_EN, 'STR_EN');
    const fe = [];
    for (const [name, f] of calls) {
      try {
        let r;
        if (/shop\.items\.\w+\.v$/.test(name)) { const id = name.split('.')[3]; r = f(Shop.effect(id, 2)); }
        else if (/share\.text$/.test(name)) r = f('City Meet', '1,234', 99, 'A', '48', true);
        else if (/(shop|list)\.(price|progress)$/.test(name)) r = f(3, 9);
        else if (/list\.sub$/.test(name)) r = f('Tanaka', '80');
        else r = f('1,234', 'x');
        if (typeof r !== 'string' && typeof r !== 'number') fe.push(name);
      } catch (err) { fe.push(name + ' ' + err.message); }
    }
    check('言葉の表（英語）：関数はどれも文字列を返す', fe.length === 0 && calls.length >= 20, 'calls=' + calls.length + ' ' + fe.slice(0, 3).join(' / '));
    const strsOf = o => { const out = []; (function w(v) { if (typeof v === 'string') out.push(v); else if (Array.isArray(v)) v.forEach(w); else if (v && typeof v === 'object') Object.keys(v).forEach(k => w(v[k])); })(o); return out; };
    const en = strsOf(STR_EN);
    check('英語：空の文節がない（「|」の前後に言葉がある）', en.every(x => x.indexOf('||') < 0 && x[0] !== '|' && x[x.length - 1] !== '|'));
    check('英語：日本語の文字（ひらがな・カタカナ・漢字）が混ざっていない', en.every(x => !/[\u3040-\u30ff\u4e00-\u9fff]/.test(x)), en.filter(x => /[\u3040-\u30ff\u4e00-\u9fff]/.test(x)).slice(0, 3).join(' / '));
    check('英語：9 つの大会・9 つの会場・ライバルの言葉がある（勝ち・負けが違う）', STR_EN.tournaments.length === NV && STR_EN.venues.length === NV && STR_EN.tournaments.every(t => t.name && t.rival.name && t.rival.short && t.rival.say && t.rival.win && t.rival.lose && t.rival.win !== t.rival.lose));
    check('英語：記録係のひとこと 9 会場 × 11 段階が全部あって、1 行に収まる長さ（34 文字まで）', STR_EN.venues.every(v => v.rec.length >= 7 + CFG.bodiesExtra.length && v.rec.concat([v.ready, v.fin, v.over('1,234')]).every(x => x.length > 0 && x.length <= 34)),
      'max=' + Math.max.apply(null, [].concat(...STR_EN.venues.map(v => v.rec.concat([v.ready, v.fin, v.over('1,234')]).map(x => x.length)))));
    check('英語：記録係のひとこと・横断幕は、会場ごとに別（同じ文が 2 つない）', (() => { const all = [].concat(...STR_EN.venues.map(v => v.rec)); return new Set(all).size === all.length && new Set(STR_EN.venues.map(v => v.banner)).size === NV; })());
    check('英語：判定の名前が 8 つ（CFG.judge と同じ数）・長い名前は判子の中で 2 行に分けられる', STR_EN.judge.length === CFG.judge.length && STR_JA.judge.length === CFG.judge.length && STR_EN.judge.slice(6).every(x => x.indexOf('|') > 0) && STR_EN.judge.slice(6).every(x => x.split('|').every(w => w.length <= 7)));
    check('英語：大会の名前・ライバルの名前が長すぎない（画面の枠に入る目安）', STR_EN.tournaments.every(t => t.name.length <= 20 && t.rival.short.length <= 10 && t.rival.name.split('|').every(w => w.length <= 20)));
    check('ph()：英語では文節の切れ目が空白になる（phL）', phL('Tap|to Start', 'en') === 'Tap to Start' && phL('去年と|同じ', 'ja') === '去年と同じ' && ph('去年と|同じ') === '去年と同じ');
    check('英語の判定名（ph したもの）：Off the Charts / Beyond Human', phL(STR_EN.judge[6], 'en') === 'Off the Charts' && phL(STR_EN.judge[7], 'en') === 'Beyond Human');
    check('英語のタイトル：Clone Side Step', phL(STR_EN.title.name, 'en') === 'Clone Side Step' && STR_EN.title.logo.join(' ') === 'CLONE SIDE STEP');

    // --- 保存 v3 と、エンディングは 1 回だけ ---
    const st = (init) => { const d = Object.assign({}, init); return { d, getItem: k => (k in d ? d[k] : null), setItem: (k, v) => { d[k] = String(v); } }; };
    const v2 = { v: 2, unlocked: 5, won: [true, true, true, true, true, false, false, false, false], best: [90, 250, 700, 1500, 3500, 0, 0, 0, 0], tickets: 777, up: { shoes: 2, clothes: 1, fall: 0, recorder: 3, cheer: 0, book: 0 } };
    const m3 = Tourney.load(st({ [SAVE_KEY]: JSON.stringify(v2) }));
    check('保存：版 2 の保存を読むと、進み具合・引換券・強化はそのまま、endingSeen は false、版は 3', m3.v === 3 && m3.unlocked === 5 && m3.tickets === 777 && m3.up.shoes === 2 && m3.up.recorder === 3 && m3.best[4] === 3500 && m3.endingSeen === false);
    const sv3 = Tourney.newSave();
    check('保存：新しい保存は版 3・endingSeen は false・書いて読み直しても同じ', sv3.v === 3 && sv3.endingSeen === false && (() => { const s0 = st({}); Tourney.persist(s0, sv3); return JSON.stringify(Tourney.load(s0)) === JSON.stringify(sv3); })());
    check('保存：endingSeen が true なら読み直しても true・true 以外（文字・数・null）は false', Tourney.sanitize({ endingSeen: true }).endingSeen === true && Tourney.sanitize({ endingSeen: 'true' }).endingSeen === false && Tourney.sanitize({ endingSeen: 1 }).endingSeen === false && Tourney.sanitize({ endingSeen: null }).endingSeen === false && Tourney.sanitize(null).endingSeen === false);
    const all = Tourney.newSave(); for (let i = 0; i < NV; i++) Tourney.record(all, i, CFG.targets[i] + 1);
    const part = Tourney.newSave(); for (let i = 0; i < NV - 1; i++) Tourney.record(part, i, CFG.targets[i] + 1);
    check('エンディング：9 大会ぜんぶ勝って、まだ見ていなければ出す。8 つまでなら出さない', Tourney.allWon(all) && Tourney.shouldShowEnding(all) === true && !Tourney.allWon(part) && Tourney.shouldShowEnding(part) === false && Tourney.shouldShowEnding(Tourney.newSave()) === false);
    check('エンディング：見たと記録すると、もう出ない（保存して読み直しても）', (() => {
      const a = JSON.parse(JSON.stringify(all)); Tourney.markEndingSeen(a);
      const s0 = st({}); Tourney.persist(s0, a); const b = Tourney.load(s0);
      return Tourney.shouldShowEnding(a) === false && Tourney.shouldShowEnding(b) === false && b.endingSeen === true;
    })());
    check('エンディング：見る前にページを閉じても（勝った保存だけ残る）、読み直すとまた出る', (() => {
      const a = Tourney.newSave(); for (let i = 0; i < NV - 1; i++) Tourney.record(a, i, CFG.targets[i] + 1);
      const r = Tourney.record(a, NV - 1, CFG.targets[NV - 1] + 1);   // 最後の大会に初めて勝った
      const s0 = st({}); Tourney.persist(s0, a);   // ここでページが閉じた
      const b = Tourney.load(s0);
      return r.ending === true && Tourney.shouldShowEnding(b) === true;
    })());
    check('エンディング：版 2 で 9 つ全部勝っていた保存は、読み込み後に 1 回だけ出る', (() => {
      const w = JSON.parse(JSON.stringify(all)); delete w.endingSeen; w.v = 2;
      const b = Tourney.load(st({ [SAVE_KEY]: JSON.stringify(w) }));
      const first = Tourney.shouldShowEnding(b); Tourney.markEndingSeen(b);
      return first === true && Tourney.shouldShowEnding(b) === false;
    })());
    check('エンディング：見たあとにベストを伸ばしても、勝ち直しても、もう出ない', (() => {
      const a = JSON.parse(JSON.stringify(all)); Tourney.markEndingSeen(a);
      const r = Tourney.record(a, NV - 1, CFG.targets[NV - 1] + 5000);
      return r.ending === false && Tourney.shouldShowEnding(a) === false && a.endingSeen === true;
    })());

    // --- 横画面のレーン・分身の並び（描画の関数は 40-render にあるので、ここでは決まりごとだけ）---
    // --- 横画面：レーンと分身の並び ---
    const aspect = r => 177.78 * r;   // 画面の幅（遊ぶ場所の幅 100 の単位）。縦 177.78 に合わせたときの横
    check('横画面：レーンの数は縦画面 1・パソコンの横画面（16:9）5・1000x560 でも 5・4:3 は 3', lanesFor(100, 26) === 1 && lanesFor(aspect(390 / 844), 26) === 1 && lanesFor(aspect(16 / 9), 26) === 5 && lanesFor(aspect(1000 / 560), 26) === 5 && lanesFor(aspect(4 / 3), 26) === 3 && lanesFor(aspect(21 / 9), 26) === 5,
      [100, aspect(16 / 9), aspect(4 / 3)].map(w => lanesFor(w, 26)).join());
    check('横画面：レーンはいつも奇数で、広いほど増える（最大 7）・変な値でも壊れない', [50, 100, 150, 200, 250, 300, 400, 500, 1000, NaN, -5].every(w => { const n = lanesFor(w, 26); return n % 2 === 1 && n >= 1 && n <= 7; }) && lanesFor(1000, 26) === 7 && lanesFor(300, 26) >= lanesFor(200, 26));
    check('横画面：レーンの並びは本人のレーンが先頭（0, -1, 1, -2, 2）', laneOrder(5).join() === '0,-1,1,-2,2' && laneOrder(1).join() === '0' && laneOrder(3).join() === '0,-1,1');
    const s1 = buildSlots(1, 47), s5 = buildSlots(5, 47), s3 = buildSlots(3, 47);
    check('分身の立つ場所：縦画面（1 レーン）は今までどおり、奥へ 3 人ずつ（1 行目は z=1）', s1.length === 47 && s1[0].z === 1 && s1[2].z === 1 && s1[3].z === 2 && s1.every(p => p.lane === 0) && s1[0].wx === -0.3 && s1[1].wx === 0 && s1[2].wx === 0.3 && s1[46].z === 16);
    check('分身の立つ場所：5 レーンは 47 人ぶんあって、同じ場所に 2 人立たない・本人のレーンの z=0 は空いている', s5.length === 47 && new Set(s5.map(p => p.z + ':' + p.lane + ':' + p.wx)).size === 47 && !s5.some(p => p.z === 0 && p.lane === 0) && s5.filter(p => p.z === 0).length === 4);
    check('分身の立つ場所：5 レーンは 1 人目から横に出る・奥行きは縦画面の半分ほど（47 人で z が 10 まで）', s5[0].z === 0 && s5[0].lane === -1 && s5[1].lane === 1 && s5[46].z <= 10 && s5[46].z < s1[46].z && s3[46].z <= 16 && s3[46].z > s5[46].z);
    check('分身の立つ場所：横に出たあとも、近い順（z の小さい順）に並ぶ', s5.every((p, i) => i === 0 || p.z >= s5[i - 1].z) && s3.every((p, i) => i === 0 || p.z >= s3[i - 1].z));
    check('保存：知らない項目は読み書きしても消えない（版 3 でも）', Tourney.sanitize({ foo: 'bar', endingSeen: true }).foo === 'bar');
  }

  const s = document.createElement('h2');
  s.textContent = fail === 0 ? '全部 OK' : 'NG が ' + fail + ' 件';
  s.className = fail === 0 ? 'ok' : 'ng';
  out.insertBefore(s, out.firstChild);
  window.__verifyFail = fail;
})();
</script>
