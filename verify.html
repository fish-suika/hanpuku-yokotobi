<script>
// ===== 調整用の数値 =====
const CFG = {
  h: 1 / 120,            // 検証用の固定刻み
  duration: 20,          // 測定の長さ（秒）
  readySecs: 1.2,        // 「よーい」から「ピッ」まで
  finishSecs: 2.2,       // 「ピーッ」から記録用紙まで
  stunSecs: 0.4,         // 転んで動けない時間
  stunDrop: 2,           // 転ぶと勢いが落ちる段階
  hopK: 28,              // 位置が目標へ寄る速さ（大きいほど速く跳ぶ絵）

  // 勢い（直近1秒ほどの跳ぶ速さ 回/秒）。段階 i になる最低の速さ
  levelRate: [0, 2.5, 3.5, 4.5, 5.5, 6.5, 8],   // 2026-11-07 本人の感想で下げた（元は 3 / 4.5 / 6 / 7.5 / 9 / 10.5）
  winFull: 0.8,          // この秒数までの歩は重さ1
  winEnd: 1.2,           // この秒数で重さ0（その間は線形に減る）
  upHold: 0.4,           // 上の段階の速さを保ってから上がるまで
  downHold: 0.8,         // 遅くなってから下がるまで
  bodies: [1, 2, 4, 8, 16, 32, 48],   // 段階ごとの体の数（本人を含む）。段階1から分身する

  // 判定（記録の下限）
  judge: [[0, 'E'], [40, 'D'], [80, 'C'], [150, 'B'], [400, 'A'], [1000, 'S'], [3000, '測定不能'], [7000, '人類の範囲外']],   // 分身が早く出るようにしたので記録の桁が上がった（元は 130/200/400/1000/3000）

  // v2 大会：ライバルの記録（これを超えると勝ち）。数字は仮。Phase 2 でボットを使って調整する
  targets: [80, 200, 500, 1200, 3000, 8000, 20000, 45000, 100000],

  // v2 Phase 2：購買部。強化は、測定の前に CFG の値へ掛け算・足し算で反映する（Shop.apply）。ここの値は強化なしの素の値
  recMul: 1,             // 記録の倍率（記録係を増やす）
  startLvl: 0,           // 測定のはじめの勢いの段階（応援団）
  startGrace: 0,         // はじめのこの秒数は、勢いが落ちない（応援団）
  levelRateExtra: [8.6, 9.6, 10.8, 12.5],            // 分身の秘伝書で増える段階 7〜10 の、段階になる最低の速さ
  bodiesExtra: [100, 500, 3000, 20000],        // その段階の体の数
  payWin: 0.08, payLose: 0.04,                 // 記録のうち引換券になる割合（勝ったときは多い）
  payPart: 0.3,                                // 参加賞：まだ勝っていない大会の目標の記録に、この割合をかけた引換券
  shop: {
    // price＝次の段階を買う値段（配列の長さ＝段階の数）。ほかは段階ごとの効果
    shoes:    { price: [130, 950, 3200, 35000, 380000], mul: [1.2, 1.3, 1.4, 1.5, 1.6] },                         // 勢いを数える時間の倍率
    clothes:  { price: [190, 1400, 4700, 51000, 560000], mul: [0.8, 0.72, 0.65, 0.6, 0.55] },                  // 段階になる速さの倍率
    fall:     { price: [430, 7000, 77000, 840000], drop: [1, 1, 1, 0], secs: [0.36, 0.32, 0.28, 0.24] },     // 転んだときの勢いの落ち方・動けない時間
    recorder: { price: [290, 2100, 23000, 250000, 2800000], mul: [1.5, 2, 3, 5, 8] },                                 // 記録の倍率
    cheer:    { price: [640, 10000, 110000, 1300000], lvl: [3, 4, 5, 6], grace: 3 },                            // はじめの勢いの段階
    book:     { price: [16000, 170000, 1900000, 4100000], gate: [3, 5, 7, 9] },                                     // 段階の上限が増える。gate＝勝っておく大会の数
  },

  cloneDelay: 0.022,     // 分身1体あたりの遅れ（秒）
  shareUrl: 'https://fish-suika.github.io/hanpuku-yokotobi/',
};
// ===== 画面に出す言葉（ここに集める。Phase 4 で英語を足す）=====
// 「|」は文節の切れ目。画面では文節ごとに改行しない塊（.nb）になる。ph() で「|」を取れば普通の文字列
const STR = {
  title: { name: '分身|反復横とび', catch: '20秒で|何人 分身できる？', tap: 'タップで スタート' },

  list: {
    head: '大会の一覧', back: 'タイトルへ',
    progress: (n, m) => n + ' / ' + m,
    vs: 'VS', unit: '回', best: 'ベスト', noBest: 'ベスト ---',
    tagWon: '勝ち', tagNext: '挑戦！', tagLocked: 'ロック', hidden: '？？？',
    tickets: '引換券', shop: '購買部',
  },

  // 購買部。品物は 6 つ。name・desc（何が強くなるか 1 行）・lb（効果の見出し）・v（段階ごとの効果の短い表示。引数は Shop.effect の値）。画面には「lb v → 次の v」
  shop: {
    head: '購買部', tickets: '引換券', back: '大会の一覧', go: 'もう一回',
    price: n => n, max: 'MAX', soldOut: '最大', poor: 'たりない', lock: 'ロック',
    gate: name => name + 'に|勝つと|買える',
    arrow: ' → ',
    items: {
      shoes: { name: '体育館シューズ', desc: '勢いが|長もち|する', lb: '長もち', v: e => '×' + e.mul.toFixed(1) },
      clothes: { name: '新しい体操着', desc: '分身が|出やすく|なる', lb: '必要な速さ', v: e => e.mul < 1 ? '-' + Math.round((1 - e.mul) * 100) + '%' : '±0%' },
      fall: { name: '受け身の練習', desc: '転んでも|立ち直りが|早い', lb: '', v: e => '-' + e.drop + '段 ' + e.secs.toFixed(2) + '秒' },
      recorder: { name: '記録係を増やす', desc: '記録が|ふえる', lb: '記録', v: e => '×' + (e.mul % 1 ? e.mul.toFixed(1) : e.mul) },
      cheer: { name: '応援団', desc: 'はじめから|勢いが|高い', lb: 'スタート', v: e => fmtNum(e.bodies) + '人' },
      book: { name: '分身の秘伝書', desc: '分身の|上限が|ふえる', lb: '最大', v: e => fmtNum(e.bodies) + '人' },
    },
  },

  intro: { rival: 'ライバル', rec: 'ライバルの記録', unit: '回', best: 'ベスト', start: 'タップで スタート', back: 'もどる' },

  // 大会 9 つ。順番が進む順番（CFG.targets と同じ並び）
  tournaments: [
    { name: 'クラスの体力測定', rival: { name: '前の席の|田中', short: '田中', say: '去年と|同じ記録を|目指します。' } },
    { name: '学年の体力測定', rival: { name: '学年1位の|鈴木', short: '鈴木', say: '毎朝|牛乳を|飲んでいます。' } },
    { name: '校内大会', rival: { name: '体育委員長の|佐藤', short: '佐藤', say: '全校生徒が|見ていますが|気にしません。' } },
    { name: '市大会', rival: { name: '市の代表の|高橋', short: '高橋', say: '言い訳は|すでに|用意してあります。' } },
    { name: '県大会', rival: { name: '県王者の|伊藤', short: '伊藤', say: '優勝賞品の|お米を|待っています。' } },
    { name: '全国大会', rival: { name: '全国2連覇の|渡辺', short: '渡辺', say: 'テレビに|映るので|髪を 整えました。' } },
    { name: '世界大会', rival: { name: '世界王者の|ジャン', short: 'ジャン', say: '言葉は|通じませんが|記録は 通じます。' } },
    { name: '月面大会', rival: { name: '宇宙飛行士の|山本', short: '山本', say: '重力が 小さいので|だいぶ|有利です。' } },
    { name: '宇宙大会', rival: { name: '宇宙人の|ポポ', short: 'ポポ', say: '記録係は|腕が 6本|あります。' } },
  ],

  // 記録用紙
  sheet: {
    head: '体力測定 記録用紙', kind: '大会', rec: '記録', unit: '回',
    steps: '本当の回数', maxN: '最高の分身', trips: '転んだ回数', times: ' 回', people: ' 人',
    judgeAll: '記録係は|ぜんいん 数えました', judgeClone: '分身も|ぜんいん 数えられました',
    bestNew: 'ベスト こうしん！', best: n => 'ベスト ' + n + ' 回',
    rival: s => 'ライバル ' + s, you: 'あなた', vs: 'VS', win: '勝ち！', lose: '負け…',
    noteLose: n => 'あと ' + n + ' 回で|勝ち！',
    noteUnlock: s => '「' + s + '」が|ひらきました！',
    noteReplay: 'ライバルに|また 勝ちました。',
    noteEnd: '全大会|せいは！',
    retry: 'もう一回', toList: '大会の一覧', cont: 'つづける', share: 'Xで シェア',
    tickets: '引換券', ticketGain: n => '+' + n, shop: '購買部',
  },

  // 宇宙大会に勝ったあと（Phase 3 で作り直す）
  ending: {
    head: '全大会|せいは！', body: '宇宙大会に|勝ちました。', thanks: 'おめでとう！',
    best: n => '宇宙大会 ベスト ' + n + ' 回', list: '大会の一覧へ',
  },

  // 測定中の画面（記録板・ふきだし・文字の演出）
  hud: {
    banner: '体力測定', rec: '記録', real: n => 'ほんとうは ' + n + ' 回', left: 'のこり', bodies: n => '分身 ' + n + '人',
    bubble: ['いーち、にー…', 'は、はやっ！', 'えっ…？ にー、よん…', 'ひとが ふえてる…', 'ゆ、ゆかが…！', 'でんたく でんたく…！', 'そ、測定不能…！'],
    bFinish: 'そこまで！ きろくします…', bOver: n => '…' + n + ' 回です。', bReady: 'よーい…',
    ready: 'よーい…', vs: 'VS', passed: '超えた！',
  },
  pop: {
    start: 'スタート！', stumble: 'もつれた！', out: 'はみだした！', down: '勢い ダウン', end: 'そこまで！', pant: 'ゼーゼー',
    rival: 'ライバルを 超えた！',
    lv: ['', 'ぶんしん！', '4にん！', '8にん！！', '16にん！！', '32にん！！！', '測定不能！！！'],
    lvN: n => fmtNum(n) + 'にん！！！',   // 段階 7 以上（分身の秘伝書）
    crowd: ['わー！', 'すげー！', 'はやっ！', 'なにあれ！', 'ぶんしん！？', 'えええ！', '2人いる！', '見えない！'],
  },

  // 共有（文面と画像カード）
  share: {
    text: (t, rec, steps, judge, maxN, win) =>
      '分身反復横とび「' + t + '」で 記録 ' + rec + ' 回（本当は ' + steps + ' 回）、判定「' + judge + '」！' + (win ? ' ライバルに勝ち！' : '') + ' 分身 ' + maxN + ' 人 #分身反復横とび',
    card: { head: '体力測定 記録用紙', kind: '種目', kindVal: '反復横とび', rec: '記録', unit: '回', steps: '本当の回数', maxN: '最高の分身', trips: '転んだ回数', times: ' 回', people: ' 人' },
  },
};
const ph = s => s.replace(/\|/g, '');   // 「|」を取った普通の文字列

// ===== 大きな数字の表示（ここ 1 か所。Phase 4 で英語の K / M / B を足すときは units と、読みを変えるところだけ）=====
// 1 万未満はそのまま（3 桁ごとにカンマ）。1 万以上は 万・億・兆 を付けて、有効数字 4 桁まで（例 12.34万・123.4万・1234万・1.5億）
STR.num = { units: [[1e4, '万'], [1e8, '億'], [1e12, '兆']], sep: ',', sig: 4 };
function fmtNum(v) {
  let n = Math.round(Number(v));
  if (!Number.isFinite(n)) return '0';
  const neg = n < 0; if (neg) n = -n;
  const U = STR.num.units;
  let out;
  if (n < U[0][0]) {
    out = String(n).replace(/\B(?=(\d{3})+(?!\d))/g, STR.num.sep);
  } else {
    let u = 0;
    while (u + 1 < U.length && n >= U[u + 1][0]) u++;
    const body = k => {   // 有効数字 sig 桁に丸めて、余分な 0 を落とす
      const m = n / U[k][0], d = Math.max(0, STR.num.sig - 1 - Math.floor(Math.log10(m)));
      return Number(m.toFixed(d));
    };
    let m = body(u);
    if (m >= 10000 && u + 1 < U.length) { u++; m = body(u); }   // 9999.6万 → 1億 のような繰り上がり
    out = String(m) + U[u][1];
  }
  return neg ? '-' + out : out;
}
// ===== ゲームのロジック（画面を使わない）=====
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// 位置: 0=左の線 1=中央 2=右の線。side: -1=左をタップ 1=右をタップ
const Game = {
  mode: 'title',   // title → ready → play → finish → over
  t: 0, readyT: 0, finT: 0, seed: 1, rand: null,
  pos: 1, lastSide: 0, xv: 0, stun: 0,
  stepTimes: [], rate: 0, lvl: 0, upT: 0, downT: 0,
  rec: 0, recF: 0, steps: 0, trips: 0, maxN: 1, maxLvl: 0,
  events: [],

  reset(seed) {
    this.seed = seed == null ? (Date.now() & 0xffff) : seed;
    this.rand = mulberry32(this.seed);
    this.mode = 'title';
    this.t = 0; this.readyT = 0; this.finT = 0;
    this.pos = 1; this.lastSide = 0; this.xv = 0; this.stun = 0;
    this.stepTimes = []; this.rate = 0; this.lvl = 0; this.upT = 0; this.downT = 0;
    this.rec = 0; this.recF = 0; this.steps = 0; this.trips = 0; this.maxN = 1; this.maxLvl = 0;
    this.events = [];
  },

  begin() {
    if (this.mode !== 'title') return;
    this.mode = 'ready'; this.readyT = 0;
    this.events.push({ type: 'ready' });
  },

  bodies() { return CFG.bodies[this.lvl]; },

  // 次にタップしてよい側（-1/1）の一覧
  nextSides() {
    if (this.pos === 1) return this.lastSide === 0 ? [-1, 1] : [-this.lastSide];
    return [this.pos === 0 ? 1 : -1];
  },
  // 次に光らせる線（0/1/2）の一覧
  nextLines() {
    if (this.pos === 1) return this.nextSides().map(s => 1 + s);
    return [1];
  },

  // 左右のタップ。'step' 正しく跳んだ / 'trip' 転んだ / 'stun' 転んで動けない間 / 'ignored'
  input(side) {
    if (this.mode !== 'play') return 'ignored';
    if (this.stun > 0) return 'stun';
    let ok;
    if (this.pos === 1) ok = this.lastSide === 0 || side !== this.lastSide;   // 中央から、さっき行った側へまた跳ぶと転ぶ
    else ok = side === (this.pos === 0 ? 1 : -1);                             // 外の線から外へ跳ぶとはみ出して転ぶ
    if (ok) {
      if (this.pos === 1) { this.pos = 1 + side; this.lastSide = side; }
      else this.pos = 1;
      const n = this.bodies();
      this.steps++;
      this.recF += n * CFG.recMul;   // 記録の倍率（購買部）。小数のぶんは持ち越す
      const gain = Math.floor(this.recF + 1e-9) - this.rec;
      this.rec += gain;
      this.stepTimes.push(this.t);
      this.events.push({ type: 'step', n, gain, side, pos: this.pos });
      return 'step';
    }
    const was = this.lvl;
    this.trips++;
    this.stun = CFG.stunSecs;
    this.stepTimes.length = 0; this.rate = 0;
    this.lvl = Math.max(0, this.lvl - CFG.stunDrop);
    this.upT = 0; this.downT = 0;
    const wrongPos = this.pos;
    this.pos = 1;   // 転んだあとは中央から（lastSide は残すので、次は反対側へ行けばリズムがつながる）
    this.events.push({ type: 'trip', was, lvl: this.lvl, from: wrongPos, side, want: this.nextSides() });
    return 'trip';
  },

  candidate(rate) {
    let c = 0;
    for (let i = 0; i < CFG.levelRate.length; i++) if (rate >= CFG.levelRate[i]) c = i;
    return c;
  },

  step(dt) {
    this.xv += ((this.pos - 1) - this.xv) * (1 - Math.exp(-dt * CFG.hopK));
    if (this.mode === 'ready') {
      this.readyT += dt;
      if (this.readyT >= CFG.readySecs) {
        this.mode = 'play'; this.t = 0; this.events.push({ type: 'start' });
        if (CFG.startLvl > 0) {   // 応援団：はじめから高い段階
          this.lvl = Math.min(CFG.startLvl, CFG.levelRate.length - 1);
          this.maxLvl = this.lvl; this.maxN = Math.max(this.maxN, this.bodies());
          this.events.push({ type: 'lvl', up: true, lvl: this.lvl });
        }
      }
      return;
    }
    if (this.mode === 'finish') {
      this.finT += dt;
      if (this.finT >= CFG.finishSecs) { this.mode = 'over'; this.events.push({ type: 'over' }); }
      return;
    }
    if (this.mode !== 'play') return;
    this.t += dt;
    if (this.stun > 0) this.stun = Math.max(0, this.stun - dt);

    // 勢い：直近の歩を重みつきで数える（新しいほど重い）
    let sum = 0;
    const st = this.stepTimes;
    while (st.length && this.t - st[0] >= CFG.winEnd) st.shift();
    for (let i = 0; i < st.length; i++) {
      const age = this.t - st[i];
      sum += age <= CFG.winFull ? 1 : clamp((CFG.winEnd - age) / (CFG.winEnd - CFG.winFull), 0, 1);
    }
    this.rate = sum;

    const cand = this.candidate(this.rate);
    if (cand > this.lvl) {
      this.upT += dt; this.downT = 0;
      if (this.upT >= CFG.upHold) {
        this.lvl++; this.upT = 0;
        this.maxLvl = Math.max(this.maxLvl, this.lvl);
        this.maxN = Math.max(this.maxN, this.bodies());
        this.events.push({ type: 'lvl', up: true, lvl: this.lvl });
      }
    } else if (cand < this.lvl) {
      this.upT = 0;
      if (this.t < CFG.startGrace) this.downT = 0;   // はじめの少しのあいだは落ちない
      else if (this.stun <= 0) {
        this.downT += dt;
        if (this.downT >= CFG.downHold) {
          this.lvl--; this.downT = 0;
          this.events.push({ type: 'lvl', up: false, lvl: this.lvl });
        }
      }
    } else { this.upT = 0; this.downT = 0; }

    if (this.t >= CFG.duration) {
      this.t = CFG.duration;
      this.mode = 'finish'; this.finT = 0;
      this.events.push({ type: 'end' });
    }
  },
};

// 判定（記録から）
function judgeFor(rec) {
  let j = CFG.judge[0][1];
  for (const [min, name] of CFG.judge) if (rec >= min) j = name;
  return j;
}
// ===== 購買部と引換券（画面を使わない）=====
// 強化の段階は保存の up（品物ごと 0〜最大）。測定のはじめに Shop.apply(save) が CFG へ掛け算・足し算で反映する。
// Shop.apply は「素の値」から計算し直すので、何度呼んでも重ならない。20-logic.js の仕組みは変えない
const SHOP_IDS = ['shoes', 'clothes', 'fall', 'recorder', 'cheer', 'book'];

const Shop = {
  ids: SHOP_IDS,
  // 強化なしの素の値（読み込み時に控えておく）
  base: {
    winFull: CFG.winFull, winEnd: CFG.winEnd, levelRate: CFG.levelRate.slice(), bodies: CFG.bodies.slice(),
    stunSecs: CFG.stunSecs, stunDrop: CFG.stunDrop,
  },

  // 素の段階の体の数に、秘伝書で増えるぶんを足した一覧（表示用）
  allBodies() { return this.base.bodies.concat(CFG.bodiesExtra); },
  zeroUp() { const u = {}; for (const id of SHOP_IDS) u[id] = 0; return u; },
  maxLevel(id) { return CFG.shop[id].price.length; },
  level(save, id) { return clamp(Math.floor(Number(save.up && save.up[id])) || 0, 0, this.maxLevel(id)); },

  // 次の段階の値段（もう最大なら null）
  price(save, id) {
    const lv = this.level(save, id);
    return lv >= this.maxLevel(id) ? null : CFG.shop[id].price[lv];
  },
  // 次の段階を買うのに勝っておく大会の数（なければ 0）。秘伝書だけ
  gate(save, id) {
    const g = CFG.shop[id].gate;
    return g ? g[this.level(save, id)] || 0 : 0;
  },
  // 'max' 最大 ／ 'locked' 大会に勝ちが足りない ／ 'poor' 引換券が足りない ／ 'ok' 買える
  state(save, id) {
    const p = this.price(save, id);
    if (p == null) return 'max';
    if (Tourney.wonCount(save) < this.gate(save, id)) return 'locked';
    return (save.tickets || 0) >= p ? 'ok' : 'poor';
  },
  canBuy(save, id) { return this.state(save, id) === 'ok'; },
  // 買う。足りない・ロック・最大なら何も変えず、理由を返す
  buy(save, id) {
    const st = this.state(save, id);
    if (st !== 'ok') return { ok: false, reason: st };
    const p = this.price(save, id);
    save.tickets -= p;
    save.up[id] = this.level(save, id) + 1;
    return { ok: true, price: p, level: save.up[id] };
  },
  // いま買える中でいちばん安い品物（なければ null）。ボット用
  cheapest(save) {
    let best = null, bp = Infinity;
    for (const id of SHOP_IDS) if (this.canBuy(save, id)) { const p = this.price(save, id); if (p < bp) { bp = p; best = id; } }
    return best;
  },

  // 段階 lv のときの効果の値（画面の「いま → 次」の表示用）
  effect(id, lv) {
    const S = CFG.shop[id], B = this.base, k = lv - 1;
    switch (id) {
      case 'shoes': return { mul: lv > 0 ? S.mul[k] : 1 };
      case 'clothes': return { mul: lv > 0 ? S.mul[k] : 1 };
      case 'fall': return { drop: lv > 0 ? S.drop[k] : B.stunDrop, secs: lv > 0 ? S.secs[k] : B.stunSecs };
      case 'recorder': return { mul: lv > 0 ? S.mul[k] : 1 };
      case 'cheer': { const sl = lv > 0 ? S.lvl[k] : 0; return { lvl: sl, bodies: this.allBodies()[sl] }; }
      case 'book': return { bodies: this.allBodies()[B.bodies.length - 1 + lv] };
    }
  },

  // 強化を CFG に反映する（測定の前に毎回）
  apply(save) {
    const B = this.base, S = CFG.shop, lv = id => this.level(save, id);
    const sh = lv('shoes') ? S.shoes.mul[lv('shoes') - 1] : 1;
    CFG.winFull = B.winFull * sh; CFG.winEnd = B.winEnd * sh;
    const cl = lv('clothes') ? S.clothes.mul[lv('clothes') - 1] : 1;
    const tiers = lv('book');
    CFG.bodies = B.bodies.concat(CFG.bodiesExtra.slice(0, tiers));
    CFG.levelRate = B.levelRate.concat(CFG.levelRateExtra.slice(0, tiers)).map((r, i) => i === 0 ? 0 : r * cl);
    const fl = lv('fall');
    CFG.stunDrop = fl ? S.fall.drop[fl - 1] : B.stunDrop;
    CFG.stunSecs = fl ? S.fall.secs[fl - 1] : B.stunSecs;
    CFG.recMul = lv('recorder') ? S.recorder.mul[lv('recorder') - 1] : 1;
    const ch = lv('cheer');
    CFG.startLvl = ch ? Math.min(S.cheer.lvl[ch - 1], CFG.bodies.length - 1) : 0;
    CFG.startGrace = ch ? S.cheer.grace : 0;
  },
  // 強化なしの素の値に戻す（検証用）
  reset() { this.apply({ up: this.zeroUp() }); },

  // 1回の引換券。記録の一部（勝つと多め）＋ まだ勝っていない大会の参加賞（大会の目標に比例。遅い人でも進めるように）
  payout(rec, win, target, wasWon) {
    let t = rec > 0 ? Math.max(1, Math.floor(rec * (win ? CFG.payWin : CFG.payLose))) : 0;
    if (!wasWon && target > 0) t += Math.floor(target * CFG.payPart);
    return t;
  },
};
// ===== 大会のくり返し（画面を使わない）=====
// 保存の形：{ v, unlocked（遊べる一番先の大会 0始まり）, won[大会ごとの勝ち], best[大会ごとのベスト] }
// Phase 2 で tickets（引換券の残り）と up（品物ごとの強化の段階）を足した。知らない項目は読み書きしても消さない
const SAVE_KEY = 'hanpuku-yokotobi-save';
const V1_BEST_KEY = 'hanpuku-yokotobi-best';   // v1 のベスト（引き継ぎ用に読むだけ）
const SAVE_VER = 2;   // 1＝Phase 1（大会だけ）／2＝引換券と強化

const Tourney = {
  count() { return CFG.targets.length; },
  target(i) { return CFG.targets[i]; },
  // ライバルに勝つ：記録が目標を「超える」こと（同じ数は負け）。目標は使うたびに CFG から読む
  beats(rec, i) { return rec > CFG.targets[i]; },

  newSave() {
    const n = this.count();
    return { v: SAVE_VER, unlocked: 0, won: new Array(n).fill(false), best: new Array(n).fill(0), tickets: 0, up: Shop.zeroUp() };
  },

  // どんな値が来ても、使える形に直す（壊れた保存・古い保存・手で書き換えた保存）
  sanitize(o) {
    const n = this.count(), s = this.newSave();
    if (!o || typeof o !== 'object') return s;
    const out = Object.assign({}, o);   // 知らない項目は残す
    const u = Math.floor(Number(o.unlocked));
    out.unlocked = Number.isFinite(u) ? clamp(u, 0, n - 1) : 0;
    out.won = s.won.map((_, i) => Array.isArray(o.won) && o.won[i] === true);
    out.best = s.best.map((_, i) => {
      const b = Array.isArray(o.best) ? Math.floor(Number(o.best[i])) : 0;
      return Number.isFinite(b) && b > 0 ? b : 0;
    });
    // つじつま：先へ進めているなら手前は勝っている／勝った大会の次は開いている
    for (let i = 0; i < out.unlocked; i++) out.won[i] = true;
    for (let i = 0; i < n; i++) if (out.won[i]) out.unlocked = Math.max(out.unlocked, Math.min(i + 1, n - 1));
    for (let i = 0; i < out.unlocked; i++) out.won[i] = true;
    // 引換券と強化（Phase 1 の保存にはないので、なければ 0）
    const tk = Math.floor(Number(o.tickets));
    out.tickets = Number.isFinite(tk) && tk > 0 ? tk : 0;
    out.up = Shop.zeroUp();
    for (const id of Shop.ids) {
      const l = Math.floor(Number(o.up && o.up[id]));
      out.up[id] = Number.isFinite(l) ? clamp(l, 0, Shop.maxLevel(id)) : 0;
    }
    out.v = SAVE_VER;
    return out;
  },

  // 'won' 勝った ／ 'next' 挑戦できる（まだ勝っていない） ／ 'locked' まだ
  status(save, i) {
    if (save.won[i]) return 'won';
    return i <= save.unlocked ? 'next' : 'locked';
  },
  playable(save, i) { return i >= 0 && i < this.count() && i <= save.unlocked; },
  focusIndex(save) { return save.unlocked; },
  wonCount(save) { return save.won.filter(Boolean).length; },

  // 1回の結果を保存の形に反映する。勝てば次の大会が開く。遊べない大会は何も変えない
  record(save, i, rec) {
    const none = { win: false, isBest: false, prevBest: save.best[i] || 0, firstWin: false, unlockedNext: false, ending: false, gain: 0 };
    if (!this.playable(save, i)) return none;
    const prevBest = save.best[i] || 0;
    const isBest = rec > prevBest;
    if (isBest) save.best[i] = rec;
    const win = this.beats(rec, i), wasWon = !!save.won[i];
    let firstWin = false, unlockedNext = false;
    if (win) {
      firstWin = !save.won[i];
      save.won[i] = true;
      if (i + 1 < this.count() && save.unlocked < i + 1) { save.unlocked = i + 1; unlockedNext = true; }
    }
    const gain = Shop.payout(rec, win, CFG.targets[i], wasWon);   // 負けても引換券はもらえる（勝つと多め）
    save.tickets = (save.tickets || 0) + gain;
    return { win, isBest, prevBest, firstWin, unlockedNext, ending: firstWin && i === this.count() - 1, gain };
  },

  // 保存の読み込み。v2 の保存がなければ v1 のベストを最初の大会のベストとして引き継ぐ。storage は getItem/setItem を持つもの
  load(st) {
    let raw = null;
    try { raw = st.getItem(SAVE_KEY); } catch (_) {}
    if (raw) {
      try { return this.sanitize(JSON.parse(raw)); } catch (_) { return this.newSave(); }
    }
    const s = this.newSave();
    let v1 = 0;
    try { v1 = parseInt(st.getItem(V1_BEST_KEY), 10) || 0; } catch (_) {}
    if (v1 > 0) { s.best[0] = v1; this.persist(st, s); }
    return s;
  },
  persist(st, save) {
    try { st.setItem(SAVE_KEY, JSON.stringify(save)); return true; } catch (_) { return false; }
  },
};

(function () {

  const median = a => a.slice().sort((p, q) => p - q)[a.length >> 1];

  function startPlay(seed) {
    Game.reset(seed || 1); Game.begin();
    let n = 0;
    while (Game.mode !== 'play' && n++ < 1000) Game.step(CFG.h);
    Game.events.length = 0;
  }
  // 1 回ぶんの時間を進める
  function advance(sec) { for (let i = 0; i < Math.round(sec / CFG.h); i++) Game.step(CFG.h); }

  // ボット。rate 回/秒で押す。err 間違える確率。alt なら交互連打。
  function run(opt) {
    opt = Object.assign({ rate: 6, err: 0, alt: false, seed: 1 }, opt);
    Game.reset(opt.seed); Game.begin();
    const r = mulberry32(opt.seed * 7919 + 13);
    let next = opt.rate > 0 ? 0 : Infinity, altSide = 1, n = 0, maxLvl = 0, lvlAt = [];
    while (Game.mode !== 'over' && n++ < 120 * 40) {
      if (Game.mode === 'play' && Game.t >= next) {
        let side;
        if (opt.alt) { side = altSide; altSide = -altSide; }
        else {
          const ok = Game.nextSides();
          side = ok[0];
          if (ok.length === 1 && r() < opt.err) side = -ok[0];   // 間違い側（外へ出る／同じ側へ二度跳ぶ）
          else if (ok.length === 2) side = r() < 0.5 ? -1 : 1;
        }
        Game.input(side);
        next += 1 / opt.rate;
      }
      Game.step(CFG.h);
      maxLvl = Math.max(maxLvl, Game.lvl);
      if (Game.mode === 'play') lvlAt.push(Game.lvl);
    }
    return { rec: Game.rec, steps: Game.steps, trips: Game.trips, lvl: Game.lvl, maxLvl, maxN: Game.maxN, t: Game.t, mode: Game.mode, lvlAt };
  }

    // 右左左右 の順を 10 回

  check('外の線から外へ跳ぶと転ぶ（はみ出し）', r1 === 'trip' && Game.trips === 1 && Game.pos === 1);

  check('おかしい保存は直して読む（引換券は 0 以上・強化は 0〜最大）', weird.tickets === 0 && weird.up.shoes === Shop.maxLevel('shoes') && weird.up.clothes === 0 && weird.up.fall === 0 && weird.up.recorder === 2 && weird.up.cheer === 0 && weird.up.book === 1);
  check('引換券が小数・文字でも整数の枚数に直す', Tourney.sanitize({ tickets: 12.8 }).tickets === 12 && Tourney.sanitize({ tickets: 'abc' }).tickets === 0 && Tourney.sanitize({ up: 5 }).up.shoes === 0);
  check('v1 のベストの引き継ぎは、これまでどおり新しい保存の形で書かれる', JSON.parse(st2.d[SAVE_KEY]).v === 2 && JSON.parse(st2.d[SAVE_KEY]).tickets === 0);
  Shop.reset();

  // ===== ボットでペースを確認：毎秒 4 / 6 / 8 回のボットが、次に勝っていない大会を遊び続け、いちばん安い強化を買いながら宇宙大会まで =====
  // 1 回は約 30 秒（測定 20 秒＋画面）で数える
  function playThrough(rate, err, seed, maxRuns) {
    const q = Tourney.newSave(); let runs = 0, buys = 0;
    while (!q.won[N - 1] && runs < maxRuns) {
      const i = q.won.indexOf(false);
      Shop.apply(q);
      const res = run({ rate, err, seed: seed * 1000 + runs });
      Tourney.record(q, i, res.rec);
      runs++;
      for (let g = 0; g < 60; g++) { const id = Shop.cheapest(q); if (!id) break; Shop.buy(q, id); buys++; }
    }
    Shop.reset();
    return { runs, done: q.won[N - 1], up: q.up, buys, tickets: q.tickets };
  }
  const bots = [[4, 0.02], [6, 0.03], [8, 0.03]].map(([rate, err]) => {
    const rs = [1, 2, 3, 4, 5].map(sd => playThrough(rate, err, sd, 600));
    const runs = rs.map(x => x.runs).sort((a, b) => a - b);
    return { rate, err, runs: runs[2], min: runs[2] * 0.5, done: rs.every(x => x.done), up: rs[2].up };
  });
  const tbl = document.createElement('pre');
  tbl.textContent = 'ボットで宇宙大会まで（5 回の中央値・1 回 30 秒で換算）\n' + bots.map(b => '毎秒 ' + b.rate + ' 回（ミス ' + Math.round(b.err * 100) + '%）：' + b.runs + ' 回・約 ' + b.min.toFixed(1) + ' 分　最終の強化 ' + JSON.stringify(b.up)).join('\n');
  out.appendChild(tbl);
  check('ボット：毎秒 6 回の人は 20〜30 分で宇宙大会に勝つ', bots[1].done && bots[1].min >= 20 && bots[1].min <= 30, bots[1].runs + ' 回・' + bots[1].min.toFixed(1) + ' 分');
  check('ボット：毎秒 8 回の人は、毎秒 6 回の人より早い', bots[2].done && bots[2].runs < bots[1].runs, bots[2].runs + ' 回・' + bots[2].min.toFixed(1) + ' 分');
  check('ボット：毎秒 4 回の人も、いつかは勝てる（毎秒 6 回の人の 5 倍以内）', bots[0].done && bots[0].runs <= bots[1].runs * 5, bots[0].runs + ' 回・' + bots[0].min.toFixed(1) + ' 分');
  check('ボット：毎秒 6 回の人は最初の大会に 1 回目で勝てる（始めで詰まらない）', (() => { Shop.reset(); const x = run({ rate: 6, err: 0.03, seed: 1 }); return Tourney.beats(x.rec, 0); })());
  check('ボット：毎秒 4 回の人でも、最初の強化は 5 回以内に買える（遅い人でも最初の手応えが早い）', (() => {
    const q = Tourney.newSave(); let runs = 0;
    while (!Shop.cheapest(q) && runs < 30) { const i = q.won.indexOf(false); Shop.apply(q); Tourney.record(q, i, run({ rate: 4, err: 0.02, seed: 50 + runs }).rec); runs++; }
    Shop.reset(); return runs <= 5;
  })());
  Shop.reset();

  // ボットで目安：強化なしの Phase 1 で、どこまで勝てるか
  const rec6 = median([1, 2, 3, 4, 5].map(sd => run({ rate: 6, err: 0.02, seed: sd }).rec));
  const rec9 = median([1, 2, 3, 4, 5].map(sd => run({ rate: 9, err: 0.05, seed: sd }).rec));
  const beaten = rec => CFG.targets.filter(t => rec > t).length;
  check('毎秒6回のボットは、少なくとも最初の大会に勝てる（遊び始めで詰まらない）', beaten(rec6) >= 1, 'rec=' + rec6 + ' 勝てる大会=' + beaten(rec6));
  check('強化なしでは、最後の大会には勝てない（毎秒10回でも宇宙大会には届かない）', beaten(rec9) < N && beaten(b11.rec) < N, 'rec9=' + rec9 + ' 勝てる大会=' + beaten(rec9) + ' ／ 最高速 rec=' + b11.rec);

  const s = document.createElement('h2');
  s.textContent = fail === 0 ? '全部 OK' : 'NG が ' + fail + ' 件';
  s.className = fail === 0 ? 'ok' : 'ng';
  out.insertBefore(s, out.firstChild);
  window.__verifyFail = fail;
})();
</script>
